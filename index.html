  // ---------------------------------------------------------------
  // Picks: what is on screen against what the server holds
  // ---------------------------------------------------------------
  function emptyPick() { return { ats: '', ml: '', shown: null }; }
  function pickOf(g) { return state.picks[g.eventId] || (state.picks[g.eventId] = emptyPick()); }
  function loadedOf(g) { return state.loaded.picks[g.eventId] || (state.loaded.picks[g.eventId] = { ats: '', ml: '' }); }

  function parseGuessInput(raw) {
    var s = String(raw === null || raw === undefined ? '' : raw).trim();
    if (s === '') return { ok: true, value: null };
    if (!/^\d+(\.\d+)?$/.test(s)) return { ok: false, value: null };
    var n = Number(s);
    if (!isFinite(n) || n < 0 || n > 200) return { ok: false, value: null };
    return { ok: true, value: n };
  }
  function guessDirty() {
    var g = parseGuessInput(state.tbGuess);
    return !g.ok || g.value !== state.loaded.tbGuess;
  }
  function gameDirty(g) {
    var p = pickOf(g), l = loadedOf(g);
    return p.ats !== l.ats || p.ml !== l.ml;
  }
  function isDirty() {
    if (!state.week) return false;
    return (state.week.games || []).some(gameDirty) || guessDirty();
  }

  function sortedGames(w) {
    return (w.games || []).map(function (g, i) { return { g: g, i: i, t: Date.parse(g.kickoff) }; }).sort(function (a, b) {
      var x = isFinite(a.t) ? a.t : Infinity, y = isFinite(b.t) ? b.t : Infinity;
      return x === y ? a.i - b.i : (x < y ? -1 : 1);
    }).map(function (o) { return o.g; });
  }

  // Which games, in which kickoff blocks, with which teams and which tiebreaker game: when this is unchanged
  // the cards on screen are updated in place.
  function shapeOf(w) {
    return sortedGames(w).map(function (g) { return [g.eventId, g.away, g.home, kickoffBlock(g)].join('|'); }).join('\n') +
      '\n' + (w.tbGame ? String(w.tbGame.eventId) : '');
  }

  // A week as it arrives for the first time (a new week chosen, or the page opening): nothing is unsaved yet.
  function adoptWeek(w) {
    state.week = w;
    state.picks = {};
    state.loaded = { picks: {}, tbGuess: numOrNull(w.tbGuess) };
    (w.games || []).forEach(function (g) {
      var a = g.ats ? String(g.ats) : '', m = g.ml ? String(g.ml) : '';
      state.picks[g.eventId] = { ats: a, ml: m, shown: null };
      state.loaded.picks[g.eventId] = { ats: a, ml: m };
    });
    state.tbGuess = state.loaded.tbGuess === null ? '' : String(state.loaded.tbGuess);
    state.weekAt = Date.now();
    state.weekJson = JSON.stringify(w);
    syncWeekOption(w);
    saveCache();
  }

  // One game's fresh server answer against what is on screen. `was` is what the server held when the screen
  // was last in step with it (or what a save just sent). A choice that differs from `was` is the player's own
  // unsaved choice and is kept; everything else follows the server. An unsaved choice on a game that has
  // kicked off (or dropped out of the spread game) is put back. The favorite lock is then applied again
  // against the line that is now on screen.
  function mergePick(p, was, g) {
    var out = { ats: g.ats ? String(g.ats) : '', ml: g.ml ? String(g.ml) : '', shown: null };
    var atsMine = p.ats !== was.ats, mlMine = p.ml !== was.ml;
    if (!atsMine && !mlMine) return { pick: out, putBack: false };
    if (g.locked || g.counted === false) return { pick: out, putBack: out.ats !== p.ats || out.ml !== p.ml };
    if (atsMine && (!p.ats || hasLine(g))) { out.ats = p.ats; out.shown = p.shown; }      // a spread pick needs a line (D8)
    if (mlMine) out.ml = p.ml;
    var fav = favoriteOf(g);
    if (fav && out.ats === fav) out.ml = fav;
    return { pick: out, putBack: false };
  }

  function replaceFields(target, from) {
    Object.keys(target).forEach(function (k) { if (!Object.prototype.hasOwnProperty.call(from, k)) delete target[k]; });
    Object.keys(from).forEach(function (k) { target[k] = from[k]; });
  }

  // Fresh server data for the week on screen (the 60-second refresh, Refresh, the page's first fresh answer).
  // Everything is taken from it except the player's unsaved choices (design 10.4).
  function mergeWeek(w) {
    var old = state.week, byId = {}, picks = {}, loaded = {}, putBack = [];
    (old.games || []).forEach(function (g) { byId[g.eventId] = g; });
    var games = (w.games || []).map(function (ng) {
      var p = state.picks[ng.eventId] || emptyPick();
      var was = state.loaded.picks[ng.eventId] || { ats: '', ml: '' };
      var g = byId[ng.eventId];
      if (g) replaceFields(g, ng); else g = ng;        // the card's buttons hold on to the game object
      var m = mergePick(p, was, g);
      if (m.putBack) putBack.push(g);
      picks[g.eventId] = m.pick;
      loaded[g.eventId] = { ats: g.ats ? String(g.ats) : '', ml: g.ml ? String(g.ml) : '' };
      return g;
    });
    var guess = numOrNull(w.tbGuess), tbBack = false;
    if (!guessDirty()) state.tbGuess = guess === null ? '' : String(guess);
    else if (w.tbLocked) { tbBack = true; state.tbGuess = guess === null ? '' : String(guess); }
    replaceFields(old, w);
    old.games = games;
    state.picks = picks;
    state.loaded = { picks: loaded, tbGuess: guess };
    return { putBack: putBack, tbBack: tbBack };
  }

  // `afterSave`: this refresh followed a save the server refused because of a kickoff.
  function announcePutBack(res, afterSave) {
    var parts = [];
    var kicked = res.putBack.filter(function (g) { return !!g.locked; }), dropped = res.putBack.filter(function (g) { return !g.locked; });
    if (kicked.length === 1) parts.push(matchup(kicked[0]) + ' has kicked off, so your unsaved change there was put back.');
    else if (kicked.length > 1) parts.push(kicked.map(matchup).join(' and ') + ' have kicked off, so your unsaved changes there were put back.');
    dropped.forEach(function (g) { parts.push(matchup(g) + ' is no longer in the spread game, so your unsaved change there was put back.'); });
    if (res.tbBack) parts.push('The tiebreaker game has kicked off, so your unsaved total points guess was put back.');
    if (!parts.length) return false;
    if (afterSave) { parts.unshift('Not saved.'); if (isDirty()) parts.push('Tap Save again for the rest.'); }
    toast(parts.join(' '), 9000);
    return true;
  }

  // ---------------------------------------------------------------
  // Picks: taps. The page applies the favorite lock at once; the server stays the authority.
  // ---------------------------------------------------------------
  function lockedToast(g) { toast(g.status === 'final' ? 'This game is final.' : 'Kicked off. These picks are locked.'); }

  function tapSpread(g, abbr) {
    if (g.counted === false) return;
    if (g.locked) { lockedToast(g); return; }
    if (!hasLine(g)) { noLineToast(g); return; }
    var p = pickOf(g), fav = favoriteOf(g);
    p.ats = p.ats === abbr ? '' : abbr;
    p.shown = p.ats ? g.line.home : null;                 // the home spread on screen when it was tapped
    if (p.ats && p.ats === fav && p.ml !== fav) {
      p.ml = fav;                                         // taking the favorite locks the winner pick
      toast('You took ' + fav + ' ' + spreadText(spreadOf(g, fav)) + ', so ' + fav + ' is your winner too.');
    }
    afterTap(g);
  }

  function tapWinner(g, abbr) {
    if (g.counted === false) return;
    if (g.locked) { lockedToast(g); return; }
    var p = pickOf(g), fav = favoriteOf(g);
    if (fav && p.ats === fav) {
      var dog = otherTeam(g, fav);
      toast('Your winner is locked to ' + fav + ' because you took ' + fav + ' ' + spreadText(spreadOf(g, fav)) + '. Take ' + dog + ' ' +
        spreadText(spreadOf(g, dog)) + ' to choose the winner yourself.', 6500);
      return;
    }
    p.ml = p.ml === abbr ? '' : abbr;
    afterTap(g);
  }

  function noLineToast(g) {
    toast('There is no line yet for ' + matchup(g) + '. Pick the winner now and the spread once a line is posted.', 6000);
  }

  function afterTap(g) {
    updateCard(g);
    renderSummary();
    renderSavebar();
    updateSoon();
  }

  // ---------------------------------------------------------------
  // Picks: drawing
  // ---------------------------------------------------------------
  function renderNoWeeks() {
    clear(els.picksContent);
    var b = state.boot || {};
    var card = b.open === false
      ? noticeCard('Not open yet', 'Lowry Road Underground hasn’t started. Joe will say when it opens.')
      : noticeCard('No games yet', 'There are no games to pick right now.');
    // The page asks again by itself every minute (pollForOpening). This link asks now, and every tap gets an answer.
    var asking = false;
    var link = h('button', { type: 'button', class: 'link-btn', text: 'Refresh', onclick: function () {
      if (asking) { toast('Already refreshing.'); return; }
      asking = true;
      link.textContent = 'Refreshing…';
      pollForOpening(true).then(function () { asking = false; link.textContent = 'Refresh'; });
    } });
    card.appendChild(link);
    els.picksContent.appendChild(card);
    els.weekSummary.hidden = true;
    els.picksMeta.hidden = true;
  }

  function renderPicksError(err) {
    clear(els.picksContent);
    els.picksContent.appendChild(noticeCard('Couldn’t load this week', cleanMessage(err), 'Try again', function () { loadWeek(); }));
    els.weekSummary.hidden = true;
    els.picksMeta.hidden = true;
  }

  function pickButton(kind, g, abbr) {
    return h('button', { type: 'button', class: 'pick ' + kind, 'aria-pressed': 'false', 'data-team': String(abbr),
      onclick: function () { if (kind === 's') tapSpread(g, abbr); else tapWinner(g, abbr); } });
  }

  function buildGameCard(g) {
    var card = { sides: {} };
    card.stateEl = h('span', { class: 'state' });
    card.colS = h('span', { class: 'col', text: 'Spread' });
    card.colW = h('span', { class: 'col', text: 'Winner' });
    // D8: until a line is posted the card offers only the winner pick. This stands where both Spread buttons
    // would be; a tap says why.
    card.noLine = h('button', { type: 'button', class: 'pick noline', 'aria-disabled': 'true', text: 'No line yet', hidden: true,
      onclick: function () { noLineToast(g); } });
    var board = h('div', { class: 'board' }, [card.stateEl, card.colS, card.colW]);
    ['away', 'home'].forEach(function (side, i) {
      var abbr = g[side];
      var row = {
        abbr: abbr,
        rec: h('span', { class: 'rec', hidden: true }),
        sideText: h('span'),
        score: h('span', { class: 'score' }),
        s: pickButton('s', g, abbr),
        w: pickButton('w', g, abbr)
      };
      board.appendChild(h('div', { class: 'tm' }, [teamLogo(abbr), h('span', { class: 'who' }, [
        h('b', null, [String(abbr), row.rec]),
        h('small', null, [h('span', { class: 'nick', text: teamNickname(abbr) + ' · ' }), row.sideText])
      ])]));
      board.appendChild(row.score);
      board.appendChild(row.s);
      if (i === 0) board.appendChild(card.noLine);
      board.appendChild(row.w);
      card.sides[side] = row;
    });
    card.notes = h('div', { class: 'notes' });
    card.el = h('div', { class: 'game', 'data-event': String(g.eventId) }, [board, card.notes]);
    return card;
  }

  function paintPick(btn, kind, text, pressed, classes, markKind, off, label) {
    clear(btn);
    btn.appendChild(document.createTextNode(text));
    if (markKind) btn.appendChild(mark(markKind));
    btn.className = 'pick ' + kind + (classes ? ' ' + classes : '');
    btn.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    if (off) btn.setAttribute('aria-disabled', 'true'); else btn.removeAttribute('aria-disabled');
    btn.setAttribute('aria-label', label);
  }

  function resultOf(correct) { return correct === true ? 'ok' : (correct === false ? 'bad' : ''); }
  function resultWords(r) { return r === 'ok' ? ' Right.' : (r === 'bad' ? ' Wrong.' : ''); }

  // "LAR won 27–20 and covered −2.5."
  function resultSentence(g) {
    var sc = scoresOf(g);
    if (!sc) return '';
    var hi = Math.max(sc[0], sc[1]), lo = Math.min(sc[0], sc[1]), score = hi + '–' + lo;
    var w = g.winner || (sc[0] === sc[1] ? 'TIE' : (sc[0] > sc[1] ? g.away : g.home));
    var c = g.cover || '', line = hasLine(g);
    var coveredBy = (c === g.away || c === g.home) && line ? c : '';
    if (w === 'TIE') {
      if (c === 'PUSH') return 'Tied ' + score + ' on a pick ’em (PK) line: everyone gets both points.';
      return 'Tied ' + score + ': everyone gets the winner point.' + (coveredBy ? ' ' + coveredBy + ' covered ' + spreadText(spreadOf(g, coveredBy)) + '.' : '');
    }
    if (c === 'PUSH') return w + ' won ' + score + '. Landed on the spread: everyone gets the spread point.';
    if (!coveredBy) return w + ' won ' + score + '.';
    if (coveredBy === w) return w + ' won ' + score + (g.line.home === 0 ? ' on a pick ’em (PK) line, so ' + w + ' covered too.' : ' and covered ' + spreadText(spreadOf(g, w)) + '.');
    return w + ' won ' + score + ', but ' + coveredBy + ' covered ' + spreadText(spreadOf(g, coveredBy)) + '.';
  }

  function leftOutText(g) {
    if (g.why === 'before-start') return 'Left out: this game kicked off before the beta started.';
    if (g.why === 'no-line') return 'Left out: no line was posted before kickoff.';
    if (g.why === 'no-score') return 'Left out: the final score is missing, so it can’t be graded.';
    if (g.why === 'canceled') return 'Left out: this game was canceled.';
    return 'Left out of the spread game.';
  }

  // What the spread was when the pick was made, when it is no longer that. An unsaved pick compares with the
  // number that was on screen when it was tapped; a saved one uses the server's `seen` and `moved`.
  function movedInfo(g, p) {
    if (!hasLine(g) || !p.ats || (p.ats !== g.away && p.ats !== g.home)) return null;
    var now = spreadOf(g, p.ats), was;
    if (p.ats !== loadedOf(g).ats) {
      if (typeof p.shown !== 'number') return null;
      was = p.ats === g.home ? p.shown : -p.shown;
    } else {
      if (g.moved !== true || typeof g.seen !== 'number') return null;
      was = g.seen;
    }
    return was === now ? null : { team: p.ats, was: was, now: now };
  }

  function updateCard(g) {
    var card = cardMap[g.eventId];
    if (!card) return;
    var p = pickOf(g), out = g.counted === false, line = hasLine(g), fav = favoriteOf(g);
    var fin = g.status === 'final', open = !out && !g.locked, graded = fin && !out;
    var favLock = open && !!fav && p.ats === fav;
    var sc = scoresOf(g), showScore = (g.status === 'live' || fin) && !!sc;
    card.el.className = 'game' + (out ? ' out' : '');

    // The game's own state, at the left of the row that labels the two columns: the TV network when upcoming,
    // LIVE and the clock when live, Final when finished. The kickoff time is in the block header, once.
    clear(card.stateEl);
    if (g.status === 'live') {
      card.stateEl.appendChild(h('span', { class: 'live-flag', text: 'LIVE' }));
      if (g.statusText) card.stateEl.appendChild(document.createTextNode('  ' + g.statusText));
    } else if (fin || g.status === 'canceled' || g.status === 'postponed') {
      card.stateEl.appendChild(document.createTextNode(gameStatusText(g)));
    } else if (g.network) {
      card.stateEl.appendChild(document.createTextNode(String(g.network)));
    }
    card.colS.hidden = out;
    card.colW.hidden = out;
    card.noLine.hidden = out || line;

    ['away', 'home'].forEach(function (side, i) {
      var row = card.sides[side], abbr = row.abbr, record = g[side + 'Record'] || '';
      row.rec.textContent = record ? recordText(record) : '';
      row.rec.hidden = !record;
      row.sideText.textContent = g.neutral ? 'neutral site' : side;
      row.score.textContent = showScore ? String(sc[i]) : '';
      row.score.className = 'score' + (fin && g.winner && g.winner !== 'TIE' && g.winner !== abbr ? ' lost' : '');

      row.s.hidden = out || !line;
      if (!row.s.hidden) {
        var isAts = p.ats === abbr, sText = spreadText(spreadOf(g, abbr));
        var sRes = (graded && isAts) ? resultOf(g.atsCorrect) : '';
        paintPick(row.s, 's', sText, isAts, [sRes, open ? '' : 'fixed'].filter(Boolean).join(' '), sRes, !open,
          teamName(abbr) + ' ' + sText + ' against the spread.' + (isAts ? ' Your pick.' + resultWords(sRes) : ''));
      }
      row.w.hidden = out;
      if (!out) {
        var isMl = p.ml === abbr, na = favLock && abbr !== fav, held = favLock && abbr === fav;
        var wRes = (graded && isMl) ? resultOf(g.mlCorrect) : '';
        paintPick(row.w, 'w', 'Win', isMl, [wRes, open ? '' : 'fixed', na ? 'na' : ''].filter(Boolean).join(' '), wRes || (held ? 'lock' : ''), !open || na,
          teamName(abbr) + ' to win.' + (isMl ? ' Your pick.' + resultWords(wRes) : '') +
          (held ? ' Locked, because you took ' + fav + ' against the spread.' : '') + (na ? ' Not available while ' + fav + ' is your spread pick.' : ''));
      }
    });

    var notes = card.notes;
    clear(notes);
    function note(cls, kids) { notes.appendChild(h('p', { class: 'note' + (cls ? ' ' + cls : '') }, kids)); }
    if (out) { note('', leftOutText(g)); return; }
    if (fin) {
      var sentence = resultSentence(g);
      if (sentence) note('result', sentence);
      var noAts = !p.ats && g.atsCorrect === false, noMl = !p.ml && g.mlCorrect === false;
      if (noAts && noMl) note('', 'No picks made: both count as misses.');
      else if (noAts) note('', 'No spread pick: it counts as a miss.');
      else if (noMl) note('', 'No winner pick: it counts as a miss.');
      return;
    }
    if (g.locked) note('', line ? 'Kicked off. Picks are locked at ' + lineText(g) + '.' : 'Kicked off. Picks are locked.');
    // Taking the favorite locks the winner: no note for it (dropped 2026-11-26 as redundant). The padlock on the Win
    // button and the tap's message say it. This branch stays in the chain so that no other note shows in that state.
    else if (favLock) { /* nothing drawn */ }
    // Half a game: taking a favorite fills in the winner and says so, so taking an underdog has to ask for it.
    else if (line && p.ats && !p.ml) note('', 'Now pick the winner: tap Win for ' + g.away + ' or ' + g.home + '.');
    else if (line && p.ml && !p.ats) note('', 'Still needs a spread pick.');
    var mv = movedInfo(g, p);
    if (mv) {
      note('', [(g.locked ? 'Line moved after you picked: ' : 'Line moved since you picked: ') + mv.team + ' was ', h('strong', { text: spreadText(mv.was) }),
        g.locked ? ', and closed at ' : ', now ', h('strong', { text: spreadText(mv.now) }), '.']);
    }
  }

  // ---- total points ----
  function buildTbCard() {
    var input = h('input', { type: 'text', inputmode: 'numeric', id: 'tb-input', autocomplete: 'off', enterkeyhint: 'done', maxlength: 3,
      'aria-label': 'Your total points guess' });
    var r = {
      input: input,
      title: h('div', { class: 'tb-title' }),
      game: h('div', { class: 'tb-game' }),
      ouValue: h('strong'),
      lock: h('p', { class: 'note', hidden: true }),
      actual: h('div', { class: 'tb-actual', hidden: true }),
      why: ''
    };
    r.ou = h('span', { hidden: true }, ['Over/under ', r.ouValue]);      // the over/under appears here and nowhere else
    input.addEventListener('input', function () { state.tbGuess = input.value; updateTbActual(); renderSavebar(); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
    input.addEventListener('click', function () { if (r.why) toast(r.why); });
    tbRefs = r;
    return h('div', { class: 'tb-card' }, [r.title, r.game, input,
      h('div', { class: 'tb-ref' }, [h('span', { text: 'Closest guess wins a tied week.' }), r.ou]), r.lock, r.actual]);
  }

  function updateTbActual() {
    if (!tbRefs || !state.week) return;
    var actual = numOrNull(state.week.tbActual), r = tbRefs;
    if (actual === null) { r.actual.hidden = true; r.actual.textContent = ''; return; }
    var guess = parseGuessInput(state.tbGuess);
    r.actual.textContent = 'Final total: ' + actual + '.' + ((guess.ok && guess.value !== null) ? ' You were off by ' + Math.abs(guess.value - actual) + '.' : '');
    r.actual.hidden = false;
  }

  function updateTbCard() {
    if (!tbRefs || !state.week) return;
    var w = state.week, tb = w.tbGame || null, r = tbRefs, tbGame = null;
    if (tb) (w.games || []).forEach(function (g) { if (String(g.eventId) === String(tb.eventId)) tbGame = g; });
    var d = tb ? validDate(tb.kickoff) : null;
    var when = (d && tb.kickoffText !== 'TBD') ? fmt(d, { weekday: 'long' }) + ' ' + timeText(d) : '';
    r.title.textContent = 'Tiebreaker' + (when ? ' · ' + when : '');
    r.game.textContent = tb ? 'Total points in ' + tb.away + ((tbGame && tbGame.neutral) ? ' vs ' : ' @ ') + tb.home : 'Tiebreaker game: to be decided';
    if (document.activeElement !== r.input) r.input.value = state.tbGuess;
    var locked = !!w.tbLocked, decided = numOrNull(w.tbActual) !== null;
    r.why = !tb ? 'The tiebreaker game isn’t set yet.' : (locked ? 'Kicked off. Your total points guess is locked.' : '');
    r.input.readOnly = !!r.why;
    if (r.why) { r.input.setAttribute('aria-readonly', 'true'); r.input.removeAttribute('placeholder'); }
    else { r.input.removeAttribute('aria-readonly'); r.input.setAttribute('placeholder', '45'); }
    var ou = numOrNull(w.tbOverUnder);
    r.ouValue.textContent = ou === null ? '' : String(ou);
    r.ou.hidden = ou === null;
    r.lock.textContent = 'Kicked off. Your guess is locked.';
    r.lock.hidden = !(locked && !decided);
    updateTbActual();
  }

  // "2 games kick off within 3 hours and still need a pick: …" Open games only, checked again on every tap and
  // every refresh (time passes even when nothing else changes).
  function updateSoon() {
    if (!soonEl) return;
    var w = state.week, now = Date.now();
    var list = (w ? sortedGames(w) : []).filter(function (g) {
      if (g.locked || g.counted === false || !hasKickTime(g)) return false;
      var p = pickOf(g);
      if (p.ml && (p.ats || !hasLine(g))) return false;
      var t = Date.parse(g.kickoff);
      return isFinite(t) && t > now && t - now <= SOON_MS;
    });
    clear(soonEl);
    if (!list.length) { soonEl.hidden = true; return; }
    soonEl.appendChild(h('strong', { text: list.length === 1 ? '1 game kicks off within 3 hours' : list.length + ' games kick off within 3 hours' }));
    soonEl.appendChild(document.createTextNode(' and still ' + (list.length === 1 ? 'needs' : 'need') + ' a pick: ' +
      list.map(function (g) { return matchup(g) + ' (' + shortKick(g) + ')'; }).join(', ') + '.'));
    soonEl.hidden = false;
  }

  // "x of y games picked" counts GAMES with both picks in, over games that count or could still count.
  function countPicked() {
    var x = 0, y = 0;
    ((state.week && state.week.games) || []).forEach(function (g) {
      if (g.counted === false) return;
      y++;
      var p = pickOf(g);
      if (p.ats && p.ml) x++;
    });
    return { x: x, y: y };
  }

  // The open games that hold exactly one of their two picks, first kickoff first. A game with no line yet is not
  // one of them: its winner is all that can be picked (D8).
  function halfPicked() {
    return sortedGames(state.week).filter(function (g) {
      if (g.locked || g.counted === false || !hasLine(g)) return false;
      var p = pickOf(g);
      return !p.ats !== !p.ml;
    });
  }

  function renderSummary() {
    var w = state.week;
    if (!w) { els.weekSummary.hidden = true; return; }
    var c = countPicked();
    clear(els.summaryText);
    els.summaryText.appendChild(h('strong', { text: c.x + ' of ' + c.y }));
    els.summaryText.appendChild(document.createTextNode(' games picked' + (/\d/.test(String(w.record || '')) ? ' · ' + recordText(w.record) + ' so far' : '')));
    els.weekSummary.hidden = false;
  }

  function renderPicksMeta() {
    var m = els.picksMeta;
    if (!state.week) { m.hidden = true; return; }
    if (state.stale) m.textContent = state.staleFailed ? 'Couldn’t update. This is what this phone last had.' : 'Updating…';
    else {
      var at = stampText(state.week.linesAt || (state.boot && state.boot.linesAt));
      m.textContent = 'Updates every minute' + (at ? ' · Lines checked ' + at : '');
    }
    m.hidden = false;
  }

  function renderWeek() {
    var w = state.week, c = els.picksContent;
    clear(c);
    cardMap = {};
    tbRefs = null;
    soonEl = h('div', { class: 'soon', role: 'status', hidden: true });
    c.appendChild(soonEl);
    renderSummary();
    renderPicksMeta();
    var games = sortedGames(w);
    if (!games.length) { c.appendChild(noticeCard('No games yet', 'The schedule for ' + (w.label || 'this week') + ' hasn’t been set.')); return; }
    var block = '';
    games.forEach(function (g) {
      var next = kickoffBlock(g);
      if (next !== block) { c.appendChild(h('h3', { class: 'kickoff-block' }, h('span', { text: next }))); block = next; }
      var card = buildGameCard(g);
      cardMap[g.eventId] = card;
      c.appendChild(card.el);
      updateCard(g);
    });
    c.appendChild(buildTbCard());
    updateTbCard();
    updateSoon();
    var first = validDate(games[0].kickoff);
    if (first) {
      var year = first.getUTCFullYear() - (first.getUTCMonth() < 3 ? 1 : 0);
      els.seasonLabel.textContent = 'Beta · ' + year + '–' + String(year + 1).slice(-2);
    }
  }

  function renderSavebar() {
    var btn = els.saveBtn;
    function off(v) { if (v) btn.setAttribute('aria-disabled', 'true'); else btn.removeAttribute('aria-disabled'); }
    els.savebar.hidden = state.view !== 'picks' || !state.me || !els.gate.hidden;
    var w = state.week;
    if (!w) {
      els.saveCount.textContent = state.weekFailed ? 'Couldn’t load this week' : (state.weekKey ? 'Loading…' : 'Nothing to pick yet');
      els.unsaved.hidden = true;
      off(true);
      btn.textContent = state.me ? 'Save ' + possessive(state.me) + ' picks' : 'Save picks';
      return;
    }
    var c = countPicked(), dirty = isDirty();
    els.saveCount.textContent = c.y ? c.x + ' of ' + c.y + ' games picked' : 'No games to pick';
    els.unsaved.hidden = !dirty;
    off(state.saving || !dirty || state.stale);
    // "Saved" is about what is stored, not about how many games are complete: one pick or a guess is enough.
    btn.textContent = state.saving ? 'Saving…' : ((dirty || !anyStored()) ? 'Save ' + possessive(state.me) + ' picks' : 'Saved');
  }

  // Is anything at all stored for the week on screen: a single pick, or a guess?
  function anyStored() {
    if (state.loaded.tbGuess !== null) return true;
    return Object.keys(state.loaded.picks).some(function (id) { var l = state.loaded.picks[id]; return !!(l.ats || l.ml); });
  }

  // ---------------------------------------------------------------
  // Picks: loading, saving, refreshing
  // ---------------------------------------------------------------
  function loadWeek() {
    var token = ++state.reqToken, key = state.weekKey;
    state.week = null;
    state.weekFailed = false;
    state.picks = {};
    state.loaded = { picks: {}, tbGuess: null };
    state.tbGuess = '';
    cardMap = {}; tbRefs = null; soonEl = null;
    if (!key) { renderNoWeeks(); renderSavebar(); return; }
    skeleton(els.picksContent, 4, true);
    els.weekSummary.hidden = true;
    els.picksMeta.hidden = true;
    renderSavebar();
    api('api_spreadWeek', function (t) { return [key, { token: t }]; }).then(function (w) {
      if (token !== state.reqToken) return;
      adoptWeek(w);
      renderWeek();
      renderSavebar();
      if (gamesOn(w.games)) refreshWeekQuietly();           // a game is on: fresh scores now, not in a minute
    }).catch(function (e) {
      if (token !== state.reqToken) return;
      if (e && e.signedOut) return;
      state.weekFailed = true;           // the save bar says so too, in place of "Loading…"
      renderPicksError(e);
      renderSavebar();
    });
  }

  // What a save sends: only the games that changed. A changed spread pick goes with `shown` (the home spread on
  // screen when it was tapped) and with the winner that is on screen beside it, because the two are tied by the
  // favorite lock; a change to the winner alone sends only the winner. The guess goes only when it changed.
  function buildSave() {
    var picks = {}, sent = {}, n = 0;
    (state.week.games || []).forEach(function (g) {
      var p = pickOf(g), l = loadedOf(g), o = null;
      if (p.ats !== l.ats) o = { ats: p.ats, ml: p.ml, shown: p.ats ? (typeof p.shown === 'number' ? p.shown : null) : null };
      else if (p.ml !== l.ml) o = { ml: p.ml };
      if (!o) return;
      picks[g.eventId] = o;
      sent[g.eventId] = { ats: p.ats, ml: p.ml };
      n++;
    });
    return { picks: picks, sent: sent, n: n };
  }

  // What this phone holds of the Live board and the Scoreboard predates a save that has just gone through. Both
  // are forgotten, so the next visit loads them afresh, and the one that is on screen now is loaded again at once.
  function forgetBoards() {
    state.live = null; state.liveJson = ''; state.liveToken++; state.liveLoading = false; state.liveRefreshing = false;
    state.scoreboard = null; state.scoreboardJson = ''; state.sbToken++; state.scoreboardLoading = false;
    if (state.view === 'live') loadLive(true); else if (state.view === 'scoreboard') loadScoreboard(true);
  }

  function save() {
    if (!state.me) return;
    // A dim Save still answers a tap: it says why there is nothing for it to do right now.
    if (state.saving) { toast('Still saving.'); return; }
    if (!state.week) { toast(state.weekFailed ? 'This week didn’t load. Tap Try again.' : (state.weekKey ? 'Still loading.' : 'There is nothing to pick yet.')); return; }
    if (state.stale) { toast(state.staleFailed ? 'This phone couldn’t reach Lowry Road Underground. Tap Refresh, then save.' : 'Still updating. You can save in a moment.'); return; }
    var guess = parseGuessInput(state.tbGuess);
    if (!guess.ok) {
      toast('Your total points guess must be a number from 0 to 200.', 6000);
      if (tbRefs) focusEl(tbRefs.input);
      return;
    }
    var out = buildSave(), tbChanged = guess.value !== state.loaded.tbGuess;
    if (!out.n && !tbChanged) { toast(anyStored() ? 'Nothing to save. Your picks are already saved.' : 'Nothing to save yet.'); renderSavebar(); return; }
    var payload = { token: '', weekKey: state.weekKey, picks: out.picks };
    if (tbChanged) payload.tbGuess = guess.value;
    // Everything the answer needs is captured now: if another week is on screen by the time it arrives, the
    // answer must not touch it.
    var token = state.reqToken, label = state.week.label || ('Week ' + state.week.key), who = state.me, newcomer = state.week.joined === false;
    state.saving = true;
    state.saveSeq++;                 // every refresh that left before this save is now out of date
    renderSavebar();
    api('api_spreadSavePicks', function (t) { payload.token = t; return [payload]; }).then(function (res) {
      state.saving = false;
      // api() only ever hands back an answer that says ok === true: a refused save never gets here.
      forgetBoards();
      if (token !== state.reqToken || !state.week) { toast('Saved ' + possessive(who) + ' picks for ' + label + '.'); renderSavebar(); return; }
      var told = '';
      try { told = applySaveAnswer(res, out.sent, tbChanged, guess.value); }
      catch (err) {
        // It WAS saved. If the answer cannot be drawn, say so and load the week afresh rather than report a failure.
        toast('Saved ' + possessive(who) + ' picks for ' + label + '.');
        loadWeek();
        return;
      }
      // "Saved" alone would read as "done": say it when an open game still holds only one of its two picks.
      var half = halfPicked();
      if (half.length) {
        told += (told ? ' ' : '') + (half.length === 1 ? '1 game still needs a pick: ' + matchup(half[0])
          : half.length + ' games still need a pick: ' + matchup(half[0]) + ' and ' + (half.length - 1) + ' more') + '.';
      }
      toast('Saved ' + possessive(who) + ' picks for ' + label + '.' + (told ? ' ' + told : ''), told ? 8000 : 4200);
      renderSummary();
      renderSavebar();
      updateSoon();
      // A first save is what joins the spread game, and joining grades the games that have already finished
      // (blanks are misses). The answer brings back only the saved games, so the week is asked for again now.
      if (newcomer) refreshWeekQuietly();
    }, function (e) {
      // Only a failure of the request itself lands here. The server refused it or was never reached, so nothing
      // was stored; except when no answer came in time, where the page cannot know and does not say "Not saved".
      state.saving = false;
      renderSavebar();
      if (e && e.signedOut) return;
      if (e && e.refused) { toast('Not saved. Sign in again to save ' + possessive(who) + ' picks.', 7000); return; }
      var msg = cleanMessage(e);
      if (e && e.timedOut) { toast(possessive(who) + ' picks may not be saved: ' + msg, 9000); return; }
      var isLock = /kicked off|locked/i.test(msg);
      toast(isLock ? 'Not saved. ' + msg : 'Not saved: ' + msg, 8000);
      if (isLock && token === state.reqToken) refreshWeekQuietly('retry');   // the cards catch up with the kickoff
    });
  }

  // The save answer carries the server's own game objects for everything that was sent: the cards show at once
  // what was stored. Returns a sentence when what was stored is not what was on screen.
  function applySaveAnswer(res, sent, tbChanged, guessValue) {
    var w = state.week, byId = {}, told = [];
    (w.games || []).forEach(function (g) { byId[g.eventId] = g; });
    (Array.isArray(res.games) ? res.games : []).forEach(function (ng) {
      var g = byId[ng.eventId], was = sent[ng.eventId];
      if (!g || !was) return;
      var p = pickOf(g);
      replaceFields(g, ng);
      var m = mergePick(p, was, g);
      state.picks[g.eventId] = m.pick;
      state.loaded.picks[g.eventId] = { ats: g.ats ? String(g.ats) : '', ml: g.ml ? String(g.ml) : '' };
      var stored = state.loaded.picks[g.eventId];
      if (stored.ml !== was.ml && stored.ml && g.mlLocked === true && hasLine(g)) {
        told.push(stored.ml + ' is the favorite at ' + spreadText(spreadOf(g, stored.ml)) + ', so ' + stored.ml + ' is your winner in ' + matchup(g) + '.');
      } else if (stored.ats !== was.ats || stored.ml !== was.ml) {
        told.push(matchup(g) + ' was stored differently. Check that card.');
      }
      updateCard(g);
    });
    Object.keys(sent).forEach(function (id) {
      // A game the answer did not hand back: what was sent is what the server now holds.
      if ((Array.isArray(res.games) ? res.games : []).some(function (ng) { return String(ng.eventId) === String(id); })) return;
      state.loaded.picks[id] = { ats: sent[id].ats, ml: sent[id].ml };
    });
    if (tbChanged) { state.loaded.tbGuess = guessValue; w.tbGuess = guessValue; }
    ['record', 'points', 'atsRecord', 'mlRecord', 'joined'].forEach(function (k) { if (res[k] !== undefined && res[k] !== null) w[k] = res[k]; });
    saveCache();
    return told.join(' ');
  }

  // Never redraw the list under someone who is typing or answering a dialog. A box that cannot be typed in (the
  // total-points guess once its game has kicked off) is nobody typing, even when a tap has left the focus in it.
  function busyEditing() {
    if (dialogOpen()) return true;
    var a = document.activeElement;
    return !!a && a.tagName === 'INPUT' && !a.readOnly && !!els.picksContent && els.picksContent.contains(a);
  }

  // mode: 'manual' = the Refresh link was tapped (it gets an answer in words), 'retry' = after a refused save.
  function showFreshWeek(w, mode) {
    var json = JSON.stringify(w), manual = mode === 'manual';
    state.weekAt = Date.now();
    if (json === state.weekJson && !state.stale) {
      updateSoon();                                  // time passes even when the data doesn't
      renderPicksMeta();
      if (manual) toast('Up to date.');
      return;
    }
    var before = shapeOf(state.week), wasStale = state.stale;
    var res = mergeWeek(w);
    state.stale = false; state.staleFailed = false;
    state.weekJson = json;
    syncWeekOption(state.week);
    saveCache();
    if (shapeOf(state.week) !== before || !tbRefs) {
      var y = window.pageYOffset;
      renderWeek();
      window.scrollTo(0, y);
    } else {
      (state.week.games || []).forEach(function (g) { updateCard(g); });
      updateTbCard();
      renderSummary();
      renderPicksMeta();
      updateSoon();
    }
    renderSavebar();
    if (!announcePutBack(res, mode === 'retry') && manual && !wasStale) toast('Up to date.');
  }

  // The 60-second refresh of the Picks tab (no mode), the Refresh link ('manual'), the catch-up after a save
  // that a kickoff refused ('retry'), and the first fresh answer for a week that was drawn from this phone's
  // saved copy ('open'). It KEEPS RUNNING while there are unsaved picks and updates everything except those
  // choices (design 10.4).
  function refreshWeekQuietly(mode) {
    var manual = mode === 'manual', forced = !!mode;
    if (state.stale && mode !== 'open') { if (manual) fetchBootstrap(); return Promise.resolve(); }
    if (state.weekRefreshing || !state.week || state.saving) {
      // A tap on Refresh that cannot start one right now still gets an answer.
      if (manual && state.week) toast(state.saving ? 'Saving your picks first.' : 'Already refreshing.');
      return Promise.resolve();
    }
    if (!forced && (state.view !== 'picks' || busyEditing())) return Promise.resolve();
    var token = state.reqToken, key = state.weekKey, saves = state.saveSeq;
    state.weekRefreshing = true;
    if (manual) els.refreshBtn.textContent = 'Refreshing…';
    function settled() { state.weekRefreshing = false; els.refreshBtn.textContent = 'Refresh'; }
    return api('api_spreadWeek', function (t) { return [key, { token: t }, true]; }, { quiet: !forced }).then(function (w) {
      settled();
      // Anything that happened meanwhile wins: another week loaded, a save started, someone began typing.
      if (token !== state.reqToken || key !== state.weekKey || !state.week) return;
      if (state.saving || busyEditing()) return;
      // A save began after this question left, so this answer may not know about it (the server can answer a
      // refresh with picks it read before the save). It is dropped; the next minute asks again.
      if (saves !== state.saveSeq) return;
      showFreshWeek(w, mode);
    }, function (e) {
      settled();
      if (mode === 'open' && token === state.reqToken) { state.staleFailed = true; renderPicksMeta(); }
      if (manual && !(e && (e.refused || e.signedOut))) toast('Couldn’t refresh: ' + cleanMessage(e), 7000);
    });
  }

  // ---------------------------------------------------------------
  // Live board, "one call per square" (design 10.1): one row per player, one column per game, and a square is
  // ONE call. One logo = that team all the way (the favorite to cover, or the underdog to win). Two smaller
  // logos = the left one covers, the right one wins. A game's picks appear at its kickoff; before that a square
  // is only a dot, full when both picks are in and empty otherwise. Once a game is graded the square adds the points.
  // ---------------------------------------------------------------

  // A pick is drawn or said only when the server has revealed BOTH the game and this player's cell (5.5).
  function cellShown(g, cell) { return !!g && g.revealed === true && !!cell && cell.hidden === false; }

  // A revealed cell as one call: the two picks, how each was graded, and the points. Points exist only once the
  // server has graded both picks (the game is final and counted); a push or a tie arrives as 'win' for everyone.
  function callOf(cell) {
    var a = (cell && cell.ats) || {}, m = (cell && cell.ml) || {};
    function res(r) { return r === 'win' ? 'ok' : (r === 'loss' ? 'bad' : ''); }
    var c = { ats: a.pick ? String(a.pick) : '', ml: m.pick ? String(m.pick) : '', atsRes: res(a.result), mlRes: res(m.result), points: null };
    if (c.atsRes && c.mlRes) c.points = (c.atsRes === 'ok' ? 1 : 0) + (c.mlRes === 'ok' ? 1 : 0);
    return c;
  }

  // Before kickoff the page knows ONE thing about a player's picks on a game: are BOTH in (design 5.5)? Never a
  // team, and nothing finer: "spread pick in, winner pick not" would give away that the spread pick is the
  // underdog, because taking the favorite sets the winner too. So there is no half state. Returns true, false,
  // or null when the cell does not say. A cell of a game that has not kicked off carries ONLY { hidden: true,
  // picked }: that one flag is all this reads.
  function bothIn(cell) {
    if (!cell) return null;
    if (typeof cell.picked === 'boolean') return cell.picked;
    return null;
  }
  // The dot that stands for it: full = both picks are in, empty = not yet.
  function pickDot(on) { return h('span', { class: 'dot' + (on ? ' on' : ''), 'aria-hidden': 'true' }); }

  function pointsWords(n) { return n === 1 ? '1 point' : n + ' points'; }
  // "GB plus 2.5 to cover": a spread pick in words, for labels that are read aloud.
  function coverWords(g, team) {
    if (!hasLine(g) || (team !== g.away && team !== g.home)) return team + ' to cover';
    var n = spreadOf(g, team);
    return n === 0 ? team + ' to cover a pick ’em (PK) line' : team + (n > 0 ? ' plus ' : ' minus ') + Math.abs(n) + ' to cover';
  }
  // One call in words: "LAR minus 2.5 to cover and to win", "GB plus 2.5 to cover, LAR to win", "no picks".
  function callWords(g, c) {
    if (!c.ats && !c.ml) return 'no picks';
    if (c.ats === c.ml) return coverWords(g, c.ats) + ' and to win';
    return (c.ats ? coverWords(g, c.ats) : 'no spread pick') + ', ' + (c.ml ? c.ml + ' to win' : 'no winner pick');
  }

  // Why a game is not in the spread game, short enough for a column head, and as a sentence of its own.
  function leftOutShort(g) {
    if (g.why === 'before-start') return 'Before the beta';
    if (g.why === 'no-line') return 'No line';
    if (g.why === 'no-score') return 'No score';
    if (g.why === 'canceled') return 'Canceled';
    return '';
  }
  function leftOutReason(g) {
    var s = leftOutText(g).replace(/^Left out: /, '');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function matchLine(abbr, score, won) {
    return h('span', { class: 'match-line' + (won ? ' won' : '') }, [h('span', { text: abbr }), h('strong', { text: score })]);
  }

  function liveStatusNode(g) {
    var st = h('span', { class: 'st' });
    if (g.status === 'live') {
      st.appendChild(h('span', { class: 'live-flag', text: 'LIVE' }));
      st.appendChild(document.createTextNode(' ' + gameStatusText(g)));
    } else st.appendChild(document.createTextNode(gameStatusText(g)));
    return st;
  }

  function liveWeekOptions(sel, current) {
    var weeks = (state.boot && state.boot.weeks) || [];
    clear(sel);
    weeks.forEach(function (w) { sel.appendChild(h('option', { value: String(w.key), text: String(w.label || w.key) })); });
    sel.value = String(current);
  }

  function openLiveGame(eventId) {
    state.liveGameId = String(eventId);
    state.liveView = 'games';
    state.liveDetail = null;
    writeStore(STORE.liveView, 'games');
    renderLive(false);
    focusEl(els.liveContent.querySelector('.game-option[aria-pressed=true]'));
  }

  // A column head: both teams with the score, the game's state, and the line in force. A game that is left out
  // of the spread game says so, and why, where the state and the line would be.
  function liveGameHead(g) {
    var sc = scorePair(g), out = g.counted === false, line = hasLine(g), st;
    if (out) {
      st = h('span', { class: 'st' }, ['Left out', h('b', { text: leftOutShort(g) })]);
    } else {
      st = liveStatusNode(g);
      st.appendChild(h('b', { text: line ? lineText(g) : 'No line' }));
    }
    return h('th', { class: 'gm ' + (out ? 'out' : g.status), scope: 'col',
      'aria-label': teamName(g.away) + ' at ' + teamName(g.home) + ', ' + sc.join(' to ') + ', ' + gameStatusText(g) +
        (out ? '. ' + leftOutText(g) : (line ? ', line ' + lineText(g) : '')) }, [
      matchLine(g.away, sc[0], !out && g.winner === g.away), matchLine(g.home, sc[1], !out && g.winner === g.home), st,
      h('button', { type: 'button', class: 'grid-game-tab', 'aria-label': 'View ' + teamName(g.away) + ' at ' + teamName(g.home) + ' in Games view',
        onclick: function () { openLiveGame(g.eventId); } })
    ]);
  }

  // One square: one player's call on one game. Its label says in words exactly what the square shows.
  function liveSquare(g, cell, player) {
    // A game that is left out of the spread game: the square is empty, whatever was picked.
    if (g.counted === false) return h('td', { class: 'c out', 'aria-label': player + ': ' + matchup(g) + ' is not in the spread game.' });
    if (!cellShown(g, cell)) {
      // Before kickoff: only a dot, full when both picks are in and empty otherwise.
      var isIn = bothIn(cell);
      return h('td', { class: 'c', 'aria-label': player + ': ' + (isIn === true ? 'both picks are in. Hidden until kickoff.'
          : (isIn === false ? 'picks not in yet.' : 'picks are hidden until kickoff.')) },
        h('span', { class: 'square' }, isIn === null ? null : pickDot(isIn)));
    }
    var c = callOf(cell), body;
    function slot(team) { return team ? teamLogo(team) : h('span', { class: 'none', text: '\u2014' }); }
    if (!c.ats && !c.ml) {
      body = slot('');                                    // no pick at all: a dash
    } else if (c.ats === c.ml) {
      body = teamLogo(c.ats);                             // the same team twice: one logo
      body.className = 'logo one';
    } else {
      // The picks differ, or one is missing: left = the spread pick, right = the winner pick, a dash for a missing one.
      body = h('span', { class: 'two' }, [slot(c.ats), h('i', { 'aria-hidden': 'true' }), slot(c.ml)]);
    }
    return h('td', { class: 'c' + (c.points === null ? '' : ' p' + c.points) }, h('button', { type: 'button', class: 'square',
      'aria-label': player + ': ' + callWords(g, c) + '.' + (c.points === null ? '' : ' ' + pointsWords(c.points) + '.') + ' View details',
      onclick: function (e) { showPickDetail(g.eventId, player, e.currentTarget); } },
      [body, c.points === null ? null : h('span', { class: 'pts', text: '+' + c.points })]));
  }

  function detailPanel() { return h('section', { class: 'pick-detail', 'aria-label': 'Pick details', 'aria-live': 'polite', hidden: true }); }

  function nowWord(g, kind, team) {
    var sc = g.status === 'live' ? scoresOf(g) : null;
    if (!sc || !team) return '';
    var lead;
    if (kind === 'ats') {
      if (!hasLine(g)) return '';
      var m = sc[1] + g.line.home - sc[0];
      lead = team === g.home ? m : -m;
      return lead > 0 ? 'Covering right now' : (lead < 0 ? 'Not covering right now' : 'On the line right now');
    }
    lead = team === g.home ? sc[1] - sc[0] : sc[0] - sc[1];
    return lead > 0 ? 'Ahead right now' : (lead < 0 ? 'Behind right now' : 'Tied right now');
  }

  function showPickDetail(eventId, player, origin) {
    var board = state.live || {}, g = null, row = null;
    (board.games || []).forEach(function (x) { if (String(x.eventId) === String(eventId)) g = x; });
    (board.rows || []).forEach(function (x) { if (x.player === player) row = x; });
    var cell = row && row.cells && row.cells[eventId];
    if (!g || g.counted === false || !cellShown(g, cell)) return;
    var panel = els.liveContent.querySelector('.pick-detail');
    if (!panel) return;
    state.liveDetail = { eventId: String(eventId), player: player };
    clear(panel);
    panel.hidden = false;
    var close = h('button', { type: 'button', class: 'link-btn', text: 'Close', 'aria-label': 'Close pick details', onclick: function () {
      state.liveDetail = null;
      panel.hidden = true;
      if (origin && origin.isConnected) focusEl(origin);
    } });
    panel.appendChild(h('div', { class: 'detail-top' }, [h('h3', { text: possessive(player) + ' picks' }), close]));
    var sc = scorePair(g);
    [g.away, g.home].forEach(function (t, i) {
      panel.appendChild(h('div', { class: 'detail-team' }, [teamLogo(t),
        h('span', null, [teamName(t), h('small', { text: g.neutral ? 'Neutral site' : (i === 0 ? 'Away' : 'Home') })]), h('span', { class: 'big', text: sc[i] })]));
    });
    // Both picks in words, whether each was right, and the points. A push gives the spread point to everyone and
    // a tie game gives the winner point to everyone, a blank pick included, so those say so instead of "Right".
    var c = callOf(cell);
    [['ats', 'Spread'], ['ml', 'Winner']].forEach(function (k) {
      var pick = c[k[0]], res = c[k[0] + 'Res'];
      var what = !pick ? 'No pick' : (k[0] === 'ats' && hasLine(g) ? pick + ' ' + spreadText(spreadOf(g, pick)) : pick);
      var forAll = k[0] === 'ats' ? (g.cover === 'PUSH' ? 'Push: everyone gets the point' : '') : (g.winner === 'TIE' ? 'Tie game: everyone gets the point' : '');
      var how = res === 'ok' ? (forAll || 'Right') : (res === 'bad' ? (pick ? 'Wrong' : 'Counts as a miss') : nowWord(g, k[0], pick));
      panel.appendChild(h('div', { class: 'detail-pick' + (res ? ' ' + res : '') }, [
        h('span', { class: 'k', text: k[1] }), h('strong', { text: what }),
        how ? h('span', { class: 'r' }, [res ? mark(res) : null, how]) : null
      ]));
    });
    if (c.points !== null) {
      panel.appendChild(h('div', { class: 'detail-points p' + c.points }, [
        h('span', { class: 'pts', 'aria-hidden': 'true', text: '+' + c.points }),
        h('span', { text: player + ' earned ' + pointsWords(c.points) + ' on this game.' })
      ]));
    }
    panel.appendChild(h('div', { class: 'detail-state', text: (g.status === 'live' ? 'LIVE · ' : '') + gameStatusText(g) + (hasLine(g) ? ' · Line ' + lineText(g) : '') }));
    if (origin) {
      try { panel.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      focusEl(close);
    }
  }

  // ---- Games view: one matchup at a time, the players' NAMES grouped by call (first version, not yet agreed) ----

  // The calls a game allows, in the order they are always listed. With a favorite there are three: the favorite
  // to cover (its winner pick is locked to the favorite, R2), the underdog to cover with the favorite to win,
  // and the underdog to win outright. With no favorite (a spread of 0) the winner pick is free on both sides, so
  // every pair of picks is a call.
  function callGroups(g) {
    var fav = favoriteOf(g);
    function cover(t) { return t + ' to cover' + (hasLine(g) ? ' ' + spreadText(spreadOf(g, t)) : ''); }
    if (fav) {
      var dog = otherTeam(g, fav);
      return [
        { ats: fav, ml: fav, title: cover(fav), said: coverWords(g, fav) },
        { ats: dog, ml: fav, title: cover(dog) + ', ' + fav + ' to win', said: coverWords(g, dog) + ', ' + fav + ' to win' },
        { ats: dog, ml: dog, title: dog + ' to win outright', said: dog + ' to win outright' }
      ];
    }
    var list = [];
    [g.away, g.home].forEach(function (a) {
      var b = otherTeam(g, a);
      list.push({ ats: a, ml: a, title: cover(a) + ' and win', said: coverWords(g, a) + ' and to win' });
      list.push({ ats: a, ml: b, title: cover(a) + ', ' + b + ' to win', said: coverWords(g, a) + ', ' + b + ' to win' });
    });
    return list;
  }

  // The points a call earns once its game is graded, by the server's own two rules: the spread point for the
  // team that covered (for everyone on a push), the winner point for the winner (for everyone on a tie game).
  function gameGraded(g) { return g.status === 'final' && g.counted !== false && !!g.cover && !!g.winner; }
  function callPoints(g, ats, ml) {
    return ((g.cover === 'PUSH' || (!!ats && ats === g.cover)) ? 1 : 0) + ((g.winner === 'TIE' || (!!ml && ml === g.winner)) ? 1 : 0);
  }

  // "Both picks in: Ann, Ben."
  function whoLine(label, names) {
    return names.length ? h('div', { class: 'who-line' }, [h('strong', { text: label + ': ' }), names.join(', ') + '.']) : null;
  }

  // Everything under the score of the chosen game: the calls with the names on each, then the players who made
  // only one of the two picks, then the players who made none. Before kickoff: only who has picked, never what.
  function renderCalls(focused, g, rows) {
    var groups = g.revealed === true ? callGroups(g) : [], fav = favoriteOf(g), graded = gameGraded(g);
    var members = groups.map(function () { return []; });
    var atsOnly = [], mlOnly = [], none = [], waiting = { yes: [], no: [], unknown: [] };      // not revealed: are both picks in?
    rows.forEach(function (r) {
      var cell = r.cells && r.cells[g.eventId];
      if (!cellShown(g, cell)) { var isIn = bothIn(cell); waiting[isIn === true ? 'yes' : (isIn === false ? 'no' : 'unknown')].push(r.player); return; }
      var c = callOf(cell);
      if (!c.ats && !c.ml) { none.push(r.player); return; }
      if (!c.ml) { atsOnly.push(r.player + ' (' + c.ats + (hasLine(g) ? ' ' + spreadText(spreadOf(g, c.ats)) : '') + ')'); return; }
      if (!c.ats) { mlOnly.push(r.player + ' (' + c.ml + ')'); return; }
      var at = -1;
      groups.forEach(function (grp, i) {
        // Taking the favorite locks the winner pick to it, so the favorite's spread pick alone names that call.
        if (at < 0 && grp.ats === c.ats && (grp.ml === c.ml || (!!fav && c.ats === fav))) at = i;
      });
      if (at < 0) {
        // A pair the rules do not expect (a pick that is neither team): shown as it is, never dropped.
        var words = c.ats === c.ml ? c.ats + ' to cover and win' : c.ats + ' to cover, ' + c.ml + ' to win';
        groups.push({ ats: c.ats, ml: c.ml, title: words, said: words });
        members.push([]);
        at = groups.length - 1;
      }
      members[at].push(r);
    });
    if (g.revealed !== true) {
      focused.appendChild(noticeCard('Picks appear at kickoff', hasLine(g) ? 'The line right now is ' + lineText(g) + '.' : 'There is no line yet.'));
    }
    groups.forEach(function (grp, i) {
      var pts = graded ? callPoints(g, grp.ats, grp.ml) : null, list = members[i];
      var group = h('section', { class: 'call' + (pts === null ? '' : ' p' + pts),
        'aria-label': grp.said + '.' + (pts === null ? '' : ' ' + pointsWords(pts) + '.') + ' ' + (list.length === 1 ? '1 player' : list.length + ' players') },
        h('div', { class: 'call-heading' }, [h('h3', { text: grp.title }), pts === null ? null : h('span', { class: 'pts', 'aria-hidden': 'true', text: '+' + pts })]));
      list.forEach(function (r) {
        group.appendChild(h('button', { type: 'button', class: 'person-pick' + (r.player === state.me ? ' me' : ''), text: r.player,
          'aria-label': possessive(r.player) + ' picks. View details', onclick: function (e) { showPickDetail(g.eventId, r.player, e.currentTarget); } }));
      });
      if (!list.length) group.appendChild(h('div', { class: 'no-picks', text: 'No one' }));
      focused.appendChild(group);
    });
    var lines = [
      whoLine('Spread pick only', atsOnly), whoLine('Winner pick only', mlOnly), whoLine('No picks', none),
      whoLine('Both picks in', waiting.yes), whoLine('Not yet', waiting.no), whoLine('Hidden until kickoff', waiting.unknown)
    ].filter(Boolean);
    if (lines.length) focused.appendChild(h('div', { class: 'who-lines' }, lines));
    if (members.some(function (list) { return list.length > 0; })) {
      focused.appendChild(h('div', { class: 'focus-footnote', text: 'Tap a player for both of their picks.' }));
    }
  }

  function renderLiveGames(section, games, rows, oldScroll) {
    var g = null;
    games.forEach(function (x) { if (String(x.eventId) === state.liveGameId) g = x; });
    if (!g) {
      // Nothing chosen yet: the game that is on, else the next one, among the games that are in the spread game.
      var counted = games.filter(function (x) { return x.counted !== false; });
      g = counted.filter(function (x) { return x.status === 'live'; })[0] ||
          counted.filter(function (x) { return x.status !== 'final' && x.status !== 'canceled'; })[0] || counted[0] || games[0];
      state.liveGameId = String(g.eventId);
    }
    var rail = h('div', { class: 'game-rail', role: 'group', 'aria-label': 'Choose a matchup' });
    games.forEach(function (x) {
      var sc = scorePair(x), out = x.counted === false;
      rail.appendChild(h('button', { type: 'button', class: 'game-option', 'data-game': String(x.eventId),
        'aria-pressed': String(String(x.eventId) === state.liveGameId), 'aria-label': x.away + ' at ' + x.home + ', ' + gameStatusText(x) + (out ? ', left out' : ''),
        onclick: function () {
          state.liveGameId = String(x.eventId);
          state.liveDetail = null;
          renderLive(false);
          focusEl(els.liveContent.querySelector('.game-option[aria-pressed=true]'));
        } }, [matchLine(x.away, sc[0], false), matchLine(x.home, sc[1], false), out ? h('span', { class: 'st', text: 'Left out' }) : liveStatusNode(x)]));
    });
    section.appendChild(rail);
    if (oldScroll !== null) rail.scrollLeft = oldScroll;
    var selected = rail.querySelector('.game-option[aria-pressed=true]');
    if (selected) {
      try {
        var r = rail.getBoundingClientRect(), s = selected.getBoundingClientRect();
        if (s.left < r.left || s.right > r.right) rail.scrollLeft += s.left - r.left - (rail.clientWidth - selected.offsetWidth) / 2;
      } catch (e) { /* ignore */ }
    }
    var focused = h('section', { class: 'focused-game', 'aria-label': 'Selected matchup' });
    section.appendChild(focused);
    focused.appendChild(h('div', { class: 'focused-status' }, [
      g.status === 'live' ? h('span', { class: 'live-flag', text: 'LIVE' }) : null,
      h('span', { text: (g.status === 'scheduled' || !g.status ? kickoffBlock(g) : gameStatusText(g)) + (g.network ? ' · ' + g.network : '') })
    ]));
    var sc2 = scorePair(g);
    focused.appendChild(h('div', { class: 'focus-score' }, [g.away, g.home].map(function (t, i) {
      return h('div', { class: 'focus-team' }, [teamLogo(t),
        h('span', null, [h('strong', { text: teamNickname(t) }), h('small', { text: (g.neutral ? 'Neutral' : (i === 0 ? 'Away' : 'Home')) + ' · ' + t })]),
        h('span', { class: 'big', text: sc2[i] })]);
    })));
    if (g.counted === false) {
      // Left out of the spread game: the reason, and nobody's picks.
      focused.appendChild(noticeCard('Not in the spread game', leftOutReason(g)));
      return;
    }
    // A graded game says what happened in one sentence, as its card on the Picks tab does: it is what explains
    // the points on each call (a push or a tie game gives a point to everyone).
    var sentence = gameGraded(g) ? resultSentence(g) : '';
    if (sentence) focused.appendChild(h('p', { class: 'note result', text: sentence }));
    focused.appendChild(detailPanel());
    renderCalls(focused, g, rows);
  }

  function tiebreakerSummary(tb) {
    var parts = [tb.label || 'Tiebreaker game'];
    if (numOrNull(tb.actual) !== null) parts.push('Final total: ' + tb.actual);
    if (numOrNull(tb.overUnder) !== null) parts.push('Over/under ' + tb.overUnder);
    return parts.join(' · ');
  }

  // Guesses appear with the tiebreaker game's kickoff, never before.
  function renderTiebreaker(tb, rows) {
    if (!tb || tb.revealed !== true) return null;
    var section = sectionTable('Total points', ['Player', 'Guess'], rows.map(function (r) { return [r.player, r.tbGuess]; }), {
      numCols: [1], meCol: 0, sticky: false, subtitle: tiebreakerSummary(tb)
    });
    section.className = 'tiebreaker-board';
    return section;
  }

  function refreshMeta(iso, onRefresh) {
    var at = stampText(iso);
    return h('div', { class: 'refresh-meta' }, [
      h('span', { text: 'Updates every minute' + (at ? ' · ' + at : '') }),
      h('button', { type: 'button', class: 'link-btn', text: 'Refresh', onclick: onRefresh })
    ]);
  }

  // `fresh` = a newly loaded week: scroll the grid to the first game that isn't over yet.
  function renderLive(fresh) {
    var b = state.live || {}, c = els.liveContent;
    var oldGrid = c.querySelector('.grid-wrap'), oldRail = c.querySelector('.game-rail');
    if (oldGrid) state.liveGridScroll = oldGrid.scrollLeft;
    var oldScroll = state.liveGridScroll, railScroll = oldRail ? oldRail.scrollLeft : null;
    clear(c);
    var sel = h('select', { 'aria-label': 'Week' });

  function loadLive(force) {
    if (state.liveLoading) return;
    var key = state.weekKey;

      renderLive(false);
      if (Date.now() - state.liveAt >= AUTO_REFRESH_MS) refreshLiveQuietly();
      return;
    }
    if (!key && state.boot && !(state.boot.weeks || []).length) {
      clear(els.liveContent);
      els.liveContent.appendChild(noticeCard('No games yet', state.boot.open === false ? 'Lowry Road Underground hasn’t started.' : 'There are no games in the spread game right now.'));
      return;
    }
    var token = ++state.liveToken;
    state.liveLoading = true;
    skeleton(els.liveContent, 8, false);
    // This load holds liveLoading until it settles, unless a newer load or a week change (both bump liveToken)
    // has taken the flag over. @return {boolean} use the answer?
    function settled() {
      if (token !== state.liveToken) return false;
      state.liveLoading = false;
      if (key === state.weekKey) return true;
      if (state.view === 'live') loadLive(true);          // answered for another week: load the selected one
      return false;
    }
    api('api_spreadLive', function (t) { return [key, { token: t }]; }).then(function (b) {
      if (!settled()) return;
      state.live = b;
      state.liveAt = Date.now();
      state.liveJson = JSON.stringify(b);
      if (state.view === 'live') renderLive(true);
      if (gamesOn(b.games)) refreshLiveQuietly();           // a game is on: fresh scores now, not in a minute
    }).catch(function (e) {
      if (!settled()) return;
      if (e && e.signedOut) return;
      clear(els.liveContent);
      els.liveContent.appendChild(noticeCard('Couldn’t load the live board', cleanMessage(e), 'Try again', function () { loadLive(true); }));
    });
  }

  function refreshLiveQuietly() {

    var token = state.liveToken, key = state.live.key;
    // The flag is this one request and comes down when THIS request settles, wanted or not. It holds the
    // request, not just true, because a week change takes it down early: the abandoned request must not then
    // take down the flag of the refresh that followed it.
    var mine = state.liveRefreshing = {};

    })));
    var tbody = h('tbody');
    rows.forEach(function (r) {
      var isMe = opts.meCol !== undefined && !!state.me && String(r[opts.meCol]) === state.me;
      var tr = h('tr', { class: isMe ? 'me' : null });
      r.forEach(function (cell, i) {
        var cls = [];
        if (numCols.indexOf(i) >= 0) cls.push('num');
        if (opts.sticky !== false && i === 0) cls.push('sticky', 'sticky-1');
        if (opts.sticky !== false && i === 1) cls.push('sticky', 'sticky-2');

  function loadScoreboard(force) {
    if (state.scoreboardLoading) return;
    if (state.scoreboard && !force) {
      renderScoreboard();
      if (Date.now() - state.scoreboardAt >= AUTO_REFRESH_MS) refreshScoreboardQuietly();
      return;
    }
    var token = ++state.sbToken;     // a quiet refresh already in flight must not land on top of this load
    state.scoreboardLoading = true;
    skeleton(els.scoreboardContent, 6, false);
    api('api_spreadScoreboard', function (t) { return [{ token: t }]; }).then(function (sb) {
      if (token !== state.sbToken) return;
      state.scoreboardLoading = false;
      state.scoreboard = sb;
      state.scoreboardAt = Date.now();
      state.scoreboardJson = JSON.stringify(sb);
      renderScoreboard();
    }).catch(function (e) {
      if (token !== state.sbToken) return;
      state.scoreboardLoading = false;
      if (e && e.signedOut) return;
      clear(els.scoreboardContent);
      els.scoreboardContent.appendChild(noticeCard('Couldn’t load the scoreboard', cleanMessage(e), 'Try again', function () { loadScoreboard(true); }));
    });
  }

  function refreshScoreboardQuietly() {
    if (state.sbRefreshing || state.scoreboardLoading || !state.scoreboard) return Promise.resolve();
    var token = state.sbToken;
    state.sbRefreshing = true;
    return api('api_spreadScoreboard', function (t) { return [{ token: t }, true]; }, { quiet: true }).then(function (sb) {
      state.sbRefreshing = false;
      if (token !== state.sbToken || state.scoreboardLoading) return;
      var json = JSON.stringify(sb);
      state.scoreboardAt = Date.now();
      if (json === state.scoreboardJson) return;
      state.scoreboard = sb;
      state.scoreboardJson = json;

      renderScoreboard();
      window.scrollTo(0, y);
    }, function () {
      state.sbRefreshing = false;
    });

  // ---------------------------------------------------------------
  // Auto refresh: every 60 s while the page is on screen, quietly reload the view that is showing.
  // ---------------------------------------------------------------
  function scheduleAutoRefresh() {
    clearTimeout(autoTimer);
    autoTimer = document.hidden ? null : setTimeout(autoRefresh, AUTO_REFRESH_MS);
  }

  function autoRefresh() {
    autoTimer = null;
    if (document.hidden) return;              // resumes on visibilitychange
    refreshVisible().then(scheduleAutoRefresh, scheduleAutoRefresh);
  }

  // Nothing to pick yet: the beta has not opened, or no week is listed. The opening question is asked again,
  // quietly once a minute and at once from that screen's Refresh link (`manual`, which answers in words). When
  // a week is there, Picks is drawn without a reload. The promise it returns never fails.
  function pollForOpening(manual) {
    var token = state.bootToken;
    return api('api_spreadBootstrap', function (t) { return [{ token: t }, true]; }, { quiet: !manual }).then(function (b) {
      if (token !== state.bootToken || state.weekKey) return;
      if (Array.isArray(b.weeks) && b.weeks.length) { enterApp(b); return; }
      if (manual) toast(b.open === false ? 'Not open yet.' : 'No games yet.');
    }, function (e) {
      if (manual && !(e && (e.refused || e.signedOut))) toast('Couldn’t refresh: ' + cleanMessage(e), 7000);
    });
  }

  function refreshVisible() {
    if (!state.me || !transport.url) return Promise.resolve();
    if (!state.stale && !state.weekKey && state.boot && !(state.boot.weeks || []).length) return pollForOpening(false);
    // The saved copy is on screen: the opening question is asked again, unless "Not now" was the answer to the
    // sign-in dialog. Then it waits until the player asks for something (the Refresh link does).
    if (state.stale) { if (!dialogOpen() && !state.reauthMuted) fetchBootstrap(); return Promise.resolve(); }
    if (state.view === 'scoreboard') return refreshScoreboardQuietly();
    if (state.view === 'live') return refreshLiveQuietly();
    return refreshWeekQuietly();
  }

  // Back on screen (phone unlocked, tab switched back): refresh now if what is showing is a minute old.
  function onVisibility() {
    if (document.hidden) { clearTimeout(autoTimer); autoTimer = null; return; }
    if (!state.me) return;
    var at = state.view === 'scoreboard' ? state.scoreboardAt : (state.view === 'live' ? state.liveAt : state.weekAt);
    if (at && Date.now() - at >= AUTO_REFRESH_MS) refreshVisible();
    scheduleAutoRefresh();
  }

  // ---------------------------------------------------------------
  // Views, weeks

  function weekOptionLabel(w) {
    return String(w.label || w.key) + (w.status === 'live' ? ' (live)' : (w.status === 'final' ? ' (final)' : ''));
  }

  function findWeekMeta(key) {
    var weeks = (state.boot && state.boot.weeks) || [];
    for (var i = 0; i < weeks.length; i++) if (String(weeks[i].key) === String(key)) return weeks[i];
    return null;
  }

  function populateWeeks() {
    var sel = els.weekSelect, weeks = (state.boot && state.boot.weeks) || [];
    clear(sel);
    weeks.forEach(function (w) { sel.appendChild(h('option', { value: String(w.key), text: weekOptionLabel(w) })); });
    sel.value = state.weekKey;
    els.weekField.hidden = !weeks.length;          // nothing to choose from before the beta opens
  }

  // Keep the week menu's "(live)" / "(final)" in step with the freshest status the server reported.
  function syncWeekOption(w) {
    var meta = w && w.status ? findWeekMeta(w.key) : null;
    if (!meta || meta.status === w.status) return;
    meta.status = w.status;
    populateWeeks();
  }

  // One selected week for Picks and Live. Unsaved picks are kept until a week change is confirmed.
  function chooseWeek(next) {
    next = String(next);
    els.weekSelect.value = state.weekKey;
    var liveSelect = els.liveContent.querySelector('select');
    if (liveSelect) liveSelect.value = state.weekKey;
    if (next === state.weekKey) return Promise.resolve(true);
    if (!findWeekMeta(next) || state.weekChanging) return Promise.resolve(false);
    if (state.saving) { toast('Wait for your picks to finish saving.'); return Promise.resolve(false); }
    state.weekChanging = true;
    return guardUnsaved().then(function (ok) {
      state.weekChanging = false;
      if (!ok || state.saving) return false;
      state.weekKey = next;
      state.weekChosen = true;
      els.weekSelect.value = next;
      state.liveGameId = ''; state.liveDetail = null; state.liveGridScroll = 0;
      state.liveToken++; state.liveLoading = false; state.liveRefreshing = false;
      if (state.stale) { state.stale = false; state.staleFailed = false; }
      loadWeek();
      if (state.view === 'live') loadLive(true);
      return true;
    });
  }

  function setView(v) {
    state.view = v;
    els.view.picks.hidden = v !== 'picks';
    els.view.live.hidden = v !== 'live';
    els.view.scoreboard.hidden = v !== 'scoreboard';
    ['picks', 'live', 'scoreboard'].forEach(function (k) { els.tab[k].setAttribute('aria-selected', v === k ? 'true' : 'false'); });
    renderSavebar();
    if (v === 'scoreboard') loadScoreboard(false);
    else if (v === 'live') loadLive(false);
    else if (state.weekAt && Date.now() - state.weekAt >= AUTO_REFRESH_MS) refreshWeekQuietly();
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }

  // ---------------------------------------------------------------
  // This phone's copy of the last answers (design 10.5): the page draws it at once on the next open, says
  // "Updating…", and swaps in the fresh answer when it arrives. Nothing can be saved until then.
  // ---------------------------------------------------------------
  function saveCache() {
    if (!state.boot || !state.me || state.stale) return;
    try { writeStore(STORE.cache, JSON.stringify({ v: 1, player: state.me, boot: state.boot, week: state.week })); } catch (e) { /* too big or unavailable */ }
  }

  function readCache() {
    var raw = readStore(STORE.cache);
    if (!raw) return null;
    var c = null;
    try { c = JSON.parse(raw); } catch (e) { c = null; }
    var player = readStore(STORE.player);
    var good = !!c && c.v === 1 && !!c.boot && Array.isArray(c.boot.weeks) && !!player && c.player === player && c.boot.me === player && !!readStore(STORE.token);
    if (!good) { dropStore(STORE.cache); return null; }       // unreadable, or it belongs to another player
    return c;
  }

  function signOutLocal() {
    dropStore(STORE.token);
    dropStore(STORE.player);
    dropStore(STORE.cache);
    dropStore(STORE.gate);
    clearTimeout(autoTimer); autoTimer = null;
    state.bootToken++; state.reqToken++; state.liveToken++; state.sbToken++;
    state.boot = null; state.me = ''; state.stale = false; state.staleFailed = false;
    state.weekKey = ''; state.weekChosen = false; state.week = null; state.weekFailed = false; state.picks = {}; state.loaded = { picks: {}, tbGuess: null }; state.tbGuess = '';
    state.saving = false; state.weekRefreshing = false; state.weekAt = 0; state.weekJson = '';
    state.live = null; state.liveLoading = false; state.liveRefreshing = false; state.liveAt = 0; state.liveJson = ''; state.liveDetail = null; state.liveGameId = '';
    state.scoreboard = null; state.scoreboardLoading = false; state.sbRefreshing = false; state.scoreboardAt = 0; state.scoreboardJson = '';
    state.view = 'picks';
    cardMap = {}; tbRefs = null; soonEl = null;
    clear(els.picksContent); clear(els.liveContent); clear(els.scoreboardContent);
    ['picks', 'live', 'scoreboard'].forEach(function (k) { els.tab[k].setAttribute('aria-selected', k === 'picks' ? 'true' : 'false'); });
  }

  // "Sign out": this phone forgets the token; next time it needs the PIN again.
  function signOut() {
    els.account.open = false;
    if (!state.me) return;
    var name = state.me;
    guardUnsaved().then(function (ok) {
      if (!ok) return false;
      // Only a phone that got in with the Admin PIN box empty (a tester) is told it will not need the Admin PIN.
      var noAdmin = readStore(STORE.gate) === 'name';
      return confirmDialog({ title: 'Sign ' + name + ' out on this phone?', body: 'Signing in again on this phone will need ' + possessive(name) + ' PIN' + (noAdmin ? '.' : ' and the Admin PIN.'),
        okText: 'Sign out', cancelText: 'Stay signed in', safe: 'ok' });
    }).then(function (yes) {
      if (!yes) return;
      var token = readStore(STORE.token);
      if (token) post('api_spreadSignOut', [token]).catch(function () { /* the token is forgotten here either way */ });
      signOutLocal();
      start();
    });
  }

  // ---------------------------------------------------------------
  // Opening the page
  // ---------------------------------------------------------------
  function pickWeekKey(b, prefer) {
    var keys = (b.weeks || []).map(function (w) { return String(w.key); });
    var order = [prefer, b.currentWeekKey, b.displayWeekKey, keys[0]];
    for (var i = 0; i < order.length; i++) {
      var k = (order[i] === null || order[i] === undefined) ? '' : String(order[i]);
      if (k && keys.indexOf(k) >= 0) return k;
    }
    return '';
  }

  function withoutWeek(b) {
    var o = {};
    Object.keys(b).forEach(function (k) { if (k !== 'week') o[k] = b[k]; });
    return o;
  }

  // Draw this phone's saved copy while the fresh answer is on its way.
  function paintFromCache(c) {
    state.stale = true; state.staleFailed = false;
    state.boot = c.boot;
    state.me = String(c.boot.me);
    state.weekKey = pickWeekKey(c.boot, c.week ? c.week.key : '');
    showApp();
    populateWeeks();
    if (c.week && String(c.week.key) === state.weekKey) { adoptStale(c.week); renderWeek(); }
    else { state.week = null; skeleton(els.picksContent, 4, true); }
    renderSavebar();
  }

  function adoptStale(w) {
    state.week = w;
    state.picks = {};
    state.loaded = { picks: {}, tbGuess: numOrNull(w.tbGuess) };
    (w.games || []).forEach(function (g) {
      var a = g.ats ? String(g.ats) : '', m = g.ml ? String(g.ml) : '';
      state.picks[g.eventId] = { ats: a, ml: m, shown: null };
      state.loaded.picks[g.eventId] = { ats: a, ml: m };
    });
    state.tbGuess = state.loaded.tbGuess === null ? '' : String(state.loaded.tbGuess);
    state.weekJson = JSON.stringify(w);
  }

  // The fresh bootstrap answer: one question at open, with the current week inside it (design 10.5).
  function enterApp(b) {
    var wasStale = state.stale, hadWeek = state.week, dirty = wasStale && isDirty();
    var week = (b.week && typeof b.week === 'object') ? b.week : null;
    state.boot = withoutWeek(b);
    state.me = String(b.me || readStore(STORE.player) || '');
    writeStore(STORE.player, state.me);
    if (b.title) { try { document.title = String(b.title); } catch (e) { /* ignore */ } }
    // Unsaved taps made on the saved copy keep their week on screen, and so does a week chosen while this
    // answer was on its way; otherwise the current week opens.
    var keep = (wasStale && hadWeek && dirty) ? String(hadWeek.key) : (state.weekChosen ? state.weekKey : '');
    state.weekKey = pickWeekKey(state.boot, keep || (week ? week.key : ''));
    showApp();
    populateWeeks();
    var onScreen = !!hadWeek && String(hadWeek.key) === state.weekKey;
    if (week && String(week.key) === state.weekKey) {
      if (wasStale && onScreen) {
        showFreshWeek(week, '');
      } else {
        state.stale = false; state.staleFailed = false;
        state.reqToken++;
        adoptWeek(week);
        renderWeek();
        renderSavebar();
      }
      if (gamesOn(week.games)) refreshWeekQuietly();         // a game is on: fresh scores now, not in a minute
    } else if (wasStale && onScreen) {
      refreshWeekQuietly('open');        // the answer carried another week: this one stays "Updating…" until its own arrives
    } else {
      state.stale = false; state.staleFailed = false;
      if (!onScreen) loadWeek();
    }
    saveCache();
    if (state.view === 'live') loadLive(false);
    else if (state.view === 'scoreboard') loadScoreboard(false);
    scheduleAutoRefresh();
  }

  function fetchBootstrap() {
    var token = ++state.bootToken;
    api('api_spreadBootstrap', function (t) { return [{ token: t }, true]; }).then(function (b) {
      if (token !== state.bootToken) return;
      enterApp(b);
    }).catch(function (e) {
      if (token !== state.bootToken) return;
      if (e && e.signedOut) return;
      if (state.stale && state.boot) {
        state.staleFailed = true;
        renderPicksMeta();
        if (!(e && e.refused)) toast('Couldn’t update: ' + cleanMessage(e), 7000);
        scheduleAutoRefresh();
        return;
      }
      showGate(noticeCard('Couldn’t open Lowry Road Underground', cleanMessage(e), 'Try again', function () { start(); }));
    });
  }

  // Everything after the address is known: draw the saved copy if this phone has one, then ask the server.
  function start() {
    var cache = readCache(), painted = false;
    if (cache) {
      try { paintFromCache(cache); painted = true; }
      catch (e) {
        // A copy that cannot be drawn (damaged, or left by another version of this page) must never keep the page
        // from asking the server: it is dropped, and the page opens as it does on a phone with no copy.
        dropStore(STORE.cache);
        state.stale = false; state.staleFailed = false; state.boot = null; state.me = ''; state.week = null; state.weekKey = '';
      }
    }
    if (!painted) showGate(h('p', { class: 'boot-note', text: 'Loading…' }));
    fetchBootstrap();
  }

  function boot() {
    buildShell();
    if (readStore(STORE.liveView) === 'games') state.liveView = 'games';
    resolveTransport().then(function (t) {
      transport = t;
      if (!t.url) { showGate(noticeCard(t.title, t.body)); return; }
      start();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
