<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Spread Pick 'Em BETA: polish, before and after</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
  /* Design preview only. Both sides of every pair use the chosen Turf colors, so the only difference is the polish. */
  :root {
    --head-bg:#0f3d2e; --head-fg:#ffffff; --head-sub:#b7d3c5; --rule:#f5c518;
    --bg:#f4f6f3; --card:#ffffff; --ink:#16241d; --muted:#56655d; --line:#d9e0da; --block-bg:#e7ede8;
    --sel-bd:#b98a00; --sel-bg:#fff1b3; --sel-ink:#16241d;
    --ok:#1f7a43; --ok-soft:#e8f4ec; --bad:#a23c3a; --bad-soft:#fbeeed; --live:#c22f3d; --link:#0f5b40;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body { font:15px/1.4 Arial,Helvetica,sans-serif; color:var(--ink); background:var(--bg); -webkit-text-size-adjust:100%; overflow-x:hidden; }
  .title-row { background:var(--head-bg); color:var(--head-fg); padding:16px 14px; }
  .title { margin:0; padding-left:10px; border-left:4px solid var(--rule); font:700 25px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif; letter-spacing:.2px; text-transform:uppercase; }
  .season-label { color:var(--head-sub); font-size:13px; margin-top:4px; padding-left:14px; }
  main { max-width:650px; margin:0 auto; padding:0 12px 56px; }
  .ask { margin:16px 0 0; font-size:14px; color:var(--muted); }

  .item { margin:30px 0 0; padding-bottom:10px; border-bottom:2px solid var(--ink); }
  .item h2 { margin:0; font:700 27px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif; }
  .item p { margin:4px 0 0; font-size:13px; color:var(--muted); }
  .side { display:flex; align-items:center; gap:8px; margin:22px 0 8px; font-size:13px; color:var(--muted); }
  .side b { padding:3px 8px; border-radius:3px; font-size:12px; letter-spacing:.6px; color:var(--card); background:var(--muted); }
  .side::after { content:''; flex:1; border-top:1px solid var(--line); }
  .side.after b { background:var(--link); }
  .frame { background:var(--bg); }

  .kickoff-block { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0; padding:10px 12px; font:700 21px/1.2 'Barlow Condensed',Arial,sans-serif; background:var(--block-bg); border-left:3px solid var(--rule); }
  .kickoff-block small { font:400 13px/1.2 Arial,Helvetica,sans-serif; color:var(--muted); white-space:nowrap; }
  .live-flag { font:700 12px/1.2 Arial,Helvetica,sans-serif; color:var(--live); letter-spacing:.3px; white-space:nowrap; }
  .live-flag::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:5px; vertical-align:1px; }
  .game { padding:14px 0; border-top:1px solid var(--line); }
  .kickoff-block + .game { border-top:0; }
  .game + .kickoff-block { margin-top:8px; }
  .card-head { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); margin-bottom:8px; }
  .board { display:grid; grid-template-columns:minmax(0,1fr) auto 78px 78px; gap:8px; align-items:center; }
  .board .col { font-size:12px; color:var(--muted); text-align:center; }
  .tm { display:flex; align-items:center; gap:10px; min-width:0; }
  .logo { width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; }
  .logo img { max-width:30px; max-height:30px; object-fit:contain; display:block; }
  .logo .fb { font-size:11px; font-weight:700; }
  .who b { display:block; font-size:16px; font-weight:700; }
  .who small { display:block; font-size:13px; color:var(--muted); white-space:nowrap; }
  .score { min-width:26px; text-align:right; font:700 24px/1 'Barlow Condensed',Arial,sans-serif; font-variant-numeric:tabular-nums; }
  .score.lost { color:var(--muted); }
  .pick { position:relative; display:grid; place-items:center; min-height:52px; padding:0 4px; font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:5px; }
  .pick.on { color:var(--sel-ink); background:var(--sel-bg); border-color:var(--sel-bd); box-shadow:inset 0 0 0 1px var(--sel-bd); }
  .pick.ok { color:var(--ok); background:var(--ok-soft); border-color:var(--ok); box-shadow:inset 0 0 0 1px var(--ok); }
  .pick.bad { color:var(--bad); background:var(--bad-soft); border-color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad); }
  .pick .mark { position:absolute; top:4px; right:5px; width:13px; height:13px; }
  .note { margin:10px 0 0; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .note.result { color:var(--ink); }
  .note .mark { width:13px; height:13px; flex:0 0 13px; }
  .meta-line { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0 0; font-size:13px; color:var(--muted); }
  .meta-line span:last-child { color:var(--link); }

  .tb-card { margin-top:14px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:5px; }
  .tb-title { font-size:13px; color:var(--muted); }
  .tb-game { font-size:16px; font-weight:700; margin:2px 0 10px; }
  .tb-in { min-height:48px; display:grid; place-items:center; font-size:20px; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:4px; }
  .tb-ref { display:flex; justify-content:space-between; gap:10px; margin-top:10px; font-size:13px; color:var(--muted); }
  .tb-ref strong { color:var(--ink); }

  .sb-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .sb-h h3 { margin:0; font:700 22px/1.1 'Barlow Condensed',Arial,sans-serif; }
  .sb-h span { font-size:13px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; margin-top:8px; background:var(--card); font-size:15px; }
  th { font-size:12px; font-weight:400; color:var(--muted); text-align:left; padding:9px; border-bottom:1px solid var(--line); }
  td { padding:11px 9px; border-bottom:1px solid var(--line); }
  td:first-child { color:var(--muted); width:34px; }
  .banner { margin-top:8px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .banner strong { display:block; font-size:15px; }
  .banner small { display:block; margin-top:3px; font-size:13px; color:var(--muted); }
  .picked { display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; margin-top:14px; }
  .picked div { display:flex; justify-content:space-between; gap:8px; font-size:15px; }
  .picked span { color:var(--muted); font-variant-numeric:tabular-nums; }
  .picked .all span { color:var(--ok); }
  .picked-title { margin:16px 0 0; font-size:13px; color:var(--muted); }
  @media(max-width:360px) { .board { grid-template-columns:minmax(0,1fr) auto 68px 68px; } }
</style>
</head>
<body>
<header class="title-row"><h1 class="title">Spread Pick 'Em</h1><div class="season-label">Beta · polish, before and after</div></header>
<main id="root">
  <p class="ask">Four small changes from the family page. Each one is shown as a pair: BEFORE is the family page today, AFTER is the change. Both are in the same colors, so the only difference is the change itself. Tell Claude which to keep.</p>
</main>

<script>
(function () {
  'use strict';
  var LOGO = 'https://cdn.jsdelivr.net/gh/frertommy/team-logos@main/NFL/';
  var TEAMS = {
    GB: ['NFC', 'Green Bay Packers'], LAR: ['NFC', 'Los Angeles Rams'], CHI: ['NFC', 'Chicago Bears'], DET: ['NFC', 'Detroit Lions'],
    PHI: ['NFC', 'Philadelphia Eagles'], DAL: ['NFC', 'Dallas Cowboys'], KC: ['AFC', 'Kansas City Chiefs'], BUF: ['AFC', 'Buffalo Bills']
  };
  // Real Week 12 lines saved Wed 11/25; scores and the live clock are made up for the example.
  var G = {
    final: { away: 'GB', home: 'LAR', homeSpread: -2.5, total: 43.5, score: [20, 27], ats: 'GB', ml: 'LAR', state: 'final', day: 'Wednesday, Nov 25', time: '8:00 PM ET' },
    live:  { away: 'CHI', home: 'DET', homeSpread: 1.5, total: 55.5, score: [17, 14], ats: 'DET', ml: 'CHI', state: 'live', day: 'Thursday, Nov 26', time: '1:00 PM ET', clock: '8:42 · 3rd' },
    open1: { away: 'PHI', home: 'DAL', homeSpread: -8.5, total: 47.5, ats: 'PHI', ml: 'DAL', state: 'open', day: 'Thursday, Nov 26', time: '4:30 PM ET' },
    open2: { away: 'KC', home: 'BUF', homeSpread: -3, total: 46.5, ats: '', ml: '', state: 'open', day: 'Thursday, Nov 26', time: '8:20 PM ET' }
  };

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') el.textContent = v; else if (k === 'class') el.className = v; else el.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function nick(a) { return TEAMS[a][1].split(' ').slice(-1)[0]; }
  function sp(n) { return n === 0 ? 'PK' : (n > 0 ? '+' : '−') + Math.abs(n); }
  function spreadOf(g, a) { return a === g.home ? g.homeSpread : -g.homeSpread; }
  function logo(a) {
    var t = TEAMS[a], img = h('img', { alt: '' }), slot = h('span', { class: 'logo' }, [img]);
    img.addEventListener('error', function () { slot.innerHTML = ''; slot.appendChild(h('span', { class: 'fb', text: a })); });
    img.src = LOGO + t[0] + '/' + encodeURIComponent(t[1]) + '/' + t[1].toLowerCase().replace(/ /g, '-') + '.svg';
    return slot;
  }
  function mark(kind) {
    var paths = {
      lock: '<rect x="2.5" y="6" width="8" height="6" rx="1.2" fill="currentColor"/><path d="M4.3 6V4.4a2.2 2.2 0 0 1 4.4 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/>',
      ok: '<path d="M2.5 7l2.8 2.8L10.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
      bad: '<path d="M3 3.5l7 7M10 3.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
    };
    var s = h('span', { class: 'mark', 'aria-hidden': 'true' });
    s.innerHTML = '<svg viewBox="0 0 13 13" width="13" height="13">' + paths[kind] + '</svg>';
    return s;
  }
  function cover(g) { var m = g.score[1] + g.homeSpread - g.score[0]; return m > 0 ? g.home : (m < 0 ? g.away : 'PUSH'); }
  function winner(g) { return g.score[0] > g.score[1] ? g.away : g.home; }

  /** One game. opts: { time: show the kickoff time on the game, marks: tick/cross on graded picks,
   *  sentence: result in words, lock: 'emoji' | 'drawn' | '', total: show the over/under on the game } */
  function game(g, opts) {
    var card = h('div', { class: 'game' });
    if (opts.time) card.appendChild(h('div', { class: 'card-head' }, [h('span', { text: g.state === 'live' ? g.clock : g.time }), h('span', { text: g.state === 'final' ? 'Final' : (g.state === 'live' ? 'Live' : '') })]));
    var board = h('div', { class: 'board' }, [h('span'), h('span'), h('span', { class: 'col', text: 'Spread' }), h('span', { class: 'col', text: 'Winner' })]);
    [g.away, g.home].forEach(function (a, i) {
      var s = h('span', { class: 'pick' + (g.ats === a ? ' on' : ''), text: sp(spreadOf(g, a)) });
      var w = h('span', { class: 'pick' + (g.ml === a ? ' on' : ''), text: 'Win' });
      if (g.state === 'final') {
        var c = cover(g), wn = winner(g);
        if (g.ats === a) { var okS = c === 'PUSH' || c === a; s.className = 'pick ' + (okS ? 'ok' : 'bad'); if (opts.marks) s.appendChild(mark(okS ? 'ok' : 'bad')); }
        if (g.ml === a) { var okW = wn === a; w.className = 'pick ' + (okW ? 'ok' : 'bad'); if (opts.marks) w.appendChild(mark(okW ? 'ok' : 'bad')); }
      }
      board.appendChild(h('div', { class: 'tm' }, [logo(a), h('span', { class: 'who' }, [h('b', { text: a }), h('small', { text: nick(a) + ' · ' + (i === 0 ? 'away' : 'home') })])]));
      board.appendChild(g.score ? h('span', { class: 'score' + (g.state === 'final' && winner(g) !== a ? ' lost' : ''), text: String(g.score[i]) }) : h('span'));
      board.appendChild(s); board.appendChild(w);
    });
    card.appendChild(board);
    if (opts.sentence && g.state === 'final') {
      var c2 = cover(g), w2 = winner(g);
      card.appendChild(h('p', { class: 'note result', text: w2 + ' won ' + Math.max(g.score[0], g.score[1]) + '–' + Math.min(g.score[0], g.score[1]) + (c2 === w2 ? ' and covered ' + sp(spreadOf(g, w2)) + '.' : ', but ' + c2 + ' covered ' + sp(spreadOf(g, c2)) + '.') }));
    }
    if (opts.lock && g.state === 'live') {
      card.appendChild(opts.lock === 'emoji'
        ? h('p', { class: 'note', text: '🔒 Kicked off — locked' })
        : h('p', { class: 'note' }, [mark('lock'), 'Kicked off. Picks are locked.']));
    }
    if (opts.total) card.appendChild(h('p', { class: 'note', text: 'Over/under ' + g.total }));
    return card;
  }
  /** Kickoff header: before = "Thursday, Nov 26 · 4:30 PM ET" as one string; after = day left, time or LIVE right. */
  function block(g, polished) {
    if (!polished) return h('h3', { class: 'kickoff-block' }, [h('span', { text: g.day + ' · ' + g.time })]);
    var right = g.state === 'live' ? h('span', null, [h('span', { class: 'live-flag', text: 'LIVE' }), h('small', { text: '  ' + g.clock })])
      : h('small', { text: g.state === 'final' ? 'Final' : g.time });
    return h('h3', { class: 'kickoff-block' }, [h('span', { text: g.day }), right]);
  }
  function tbCard(withTotal) {
    return h('div', { class: 'tb-card' }, [
      h('div', { class: 'tb-title', text: 'Tiebreaker · Monday 8:15 PM ET' }), h('div', { class: 'tb-game', text: 'Total points in CAR @ TB' }),
      h('div', { class: 'tb-in', text: '45' }),
      h('div', { class: 'tb-ref' }, [h('span', { text: 'Closest guess wins a tied week.' }), withTotal ? h('span', null, ['Over/under ', h('strong', { text: '43.5' })]) : null])
    ]);
  }
  function item(n, title, why) { return h('section', { class: 'item' }, [h('h2', { text: n + ' · ' + title }), h('p', { text: why })]); }
  function side(root, label, cls, kids) {
    root.appendChild(h('div', { class: 'side' + (cls ? ' ' + cls : '') }, [h('b', { text: label }), h('span', { text: cls ? 'the change' : 'the family page today' })]));
    root.appendChild(h('div', { class: 'frame' }, kids));
  }

  var root = document.getElementById('root');

  // 1. Say it once
  root.appendChild(item(1, 'Say it once', 'The kickoff time is on the header and again on every game. A finished game shows only "Final".'));
  side(root, 'BEFORE', '', [block(G.final, false), game(G.final, { time: true }), block(G.open1, false), game(G.open1, { time: true }),
    h('div', { class: 'meta-line' }, [h('span', { text: 'Every 60s · Nov 25, 9:04 PM ET' }), h('span', { text: 'Refresh' })])]);
  side(root, 'AFTER', 'after', [block(G.final, true), game(G.final, { sentence: true }), block(G.open1, true), game(G.open1, {}),
    h('div', { class: 'meta-line' }, [h('span', { text: 'Updates every minute · 9:04 PM ET' }), h('span', { text: 'Refresh' })])]);

  // 2. Drawn marks, not emoji
  root.appendChild(item(2, 'Drawn marks, not emoji', 'An emoji padlock looks different on every phone. Right and wrong are shown by color alone.'));
  side(root, 'BEFORE', '', [block(G.live, true), game(G.live, { lock: 'emoji' }), block(G.final, true), game(G.final, { sentence: true })]);
  side(root, 'AFTER', 'after', [block(G.live, true), game(G.live, { lock: 'drawn' }), block(G.final, true), game(G.final, { sentence: true, marks: true })]);

  // 3. Over/under in one place
  root.appendChild(item(3, 'Over/under in one place', 'You asked for it on the Monday total-points guess. Under all 16 games it is 16 extra lines.'));
  side(root, 'BEFORE', '', [block(G.open1, true), game(G.open1, { total: true }), block(G.open2, true), game(G.open2, { total: true }), tbCard(true)]);
  side(root, 'AFTER', 'after', [block(G.open1, true), game(G.open1, {}), block(G.open2, true), game(G.open2, {}), tbCard(true)]);

  // 4. No tables of dashes
  root.appendChild(item(4, 'No tables of dashes', 'Before the first result the Scoreboard is a table of ones and dashes (the family page tonight).'));
  var players = [['Joe', 15], ['Dylan', 9], ['Alex', 15], ['Sam', 0]];
  var rows = players.map(function (p) { return h('tr', null, [h('td', { text: '1' }), h('td', { text: p[0] }), h('td', { text: '—' }), h('td', { text: '' })]); });
  side(root, 'BEFORE', '', [h('div', { class: 'sb-h' }, [h('h3', { text: 'Week 12' }), h('span', { text: '0 of 15 final' })]),
    h('table', null, [h('thead', null, [h('tr', null, [h('th', { text: '#' }), h('th', { text: 'Player' }), h('th', { text: 'Record' }), h('th', { text: 'Status' })])]), h('tbody', null, rows)])]);
  side(root, 'AFTER', 'after', [h('div', { class: 'sb-h' }, [h('h3', { text: 'Week 12' }), h('span', { text: 'First kickoff Thu 1:00 PM ET' })]),
    h('div', { class: 'banner' }, [h('strong', { text: 'No games are final yet' }), h('small', { text: 'Standings appear with the first result.' })]),
    h('div', { class: 'picked-title', text: 'Games picked so far' }),
    h('div', { class: 'picked' }, players.map(function (p) { return h('div', { class: p[1] === 15 ? 'all' : '' }, [p[0], h('span', { text: p[1] + ' of 15' })]); }))]);
})();
</script>
</body>
</html>
