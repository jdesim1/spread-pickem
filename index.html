<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-tVECdTY7kcYMNcJX+SqdyD1YRx81OXB9aUYvHGuRBxU='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https://cdn.jsdelivr.net https://a.espncdn.com; connect-src https://script.google.com https://script.googleusercontent.com 'self'; base-uri 'none'; form-action 'none'">
<meta name="spread-beta-build" content="d173c186bb38">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Lowry Road Underground</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Yellowtail&amp;display=swap">
<style>
  /*
   * Lowry Road Underground. Layout, type and components are the pool's "Broadcast light" page (WebApp.html).
   * Colors are "Field and chalk" (chosen 2026-11-25): grass and white yard lines. A spread pick is filled
   * evergreen, a winner pick football-leather brown. The pixel reference is spread-beta/dev/final-look.html.
   */
  :root {
    --head-bg:#0f3d2e; --head-fg:#ffffff; --head-sub:#b7d3c5; --rule:#ffffff; --block-rule:#0f3d2e;
    --bg:#f4f6f3; --card:#ffffff; --ink:#16241d; --muted:#56655d; --line:#d9e0da; --block-bg:#e7ede8;
    --sel-ats:#1a5c40; --sel-ml:#6f4320; --sel-ink:#ffffff; --sel-bd:#1a5c40;
    --ok:#1f7a43; --ok-soft:#e8f4ec; --bad:#a23c3a; --bad-soft:#fbeeed; --live:#c22f3d;
    --tab-on:#0f3d2e; --btn-bg:#0f3d2e; --btn-fg:#ffffff; --link:#0f5b40; --toast-bg:#16241d; --toast-fg:#ffffff;
    --me-bg:#e7f0ea; --soon-bg:#e7ede8; --soon-bd:#0f3d2e; --soon-ink:#16241d;
    --soil:#0a2c21; --house-h:46px;
  }

  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body { font:15px/1.4 Arial,Helvetica,sans-serif; color:var(--ink); background:var(--bg); -webkit-text-size-adjust:100%; overflow-x:hidden; }
  button, input, select { font-family:inherit; }
  button { cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--sel-bd); outline-offset:2px; }
  [hidden] { display:none !important; }

  /* ---- header + tabs ---- */
  .app { max-width:1440px; margin:0 auto; padding-bottom:104px; }
  .boot-note { margin:0; padding:22px 14px; font-size:14px; color:var(--muted); }
  /* The header is "1 · House first" (chosen 2026-11-26; the pixel reference is spread-beta/dev/lowry-options.html):
     the drawing of the house on Lowry Road, then the name. Everything in the title row stands on the band's white
     top line, which is the road; the darker band below it is underground. */
  .title-row { background:var(--head-bg); color:var(--head-fg); padding:12px 14px 0; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .brand { flex:1; min-width:0; display:flex; align-items:flex-end; gap:10px; }
  .house { display:block; flex:0 0 auto; height:var(--house-h); width:auto; }
  .title { margin:0 0 11px; font:700 25px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif; letter-spacing:.2px; text-transform:uppercase; white-space:nowrap; }
  /* The cool room (chosen 2026-11-26, "B"; the pixel reference is spread-beta/dev/coolroom-mockup.html): the band is as
     tall as the house, and a lit basement room with a couch and the game on TV hangs right under the house, the
     birch's roots under the tree. The word is a neon sign ("4 · Neon sign"). */
  .soil { position:relative; min-height:var(--house-h); background:var(--soil); color:var(--head-fg); border-top:2px solid var(--rule); padding:0 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .soil .cool { position:absolute; left:14px; top:0; height:var(--house-h); width:calc(var(--house-h) * 100 / 56); display:block; }
  .soil .under { margin-left:calc(var(--house-h) * 100 / 56 + 10px); font:400 27px/1 'Yellowtail',cursive; letter-spacing:.01em; text-transform:none; color:#fff4f2; text-shadow:0 0 5px rgba(255,140,124,.95), 0 0 13px rgba(214,64,50,.9); }
  .season-label { color:var(--head-sub); font-size:13px; margin:0; padding:0; }
  .account { position:relative; flex-shrink:0; margin-bottom:3px; }
  .account summary { list-style:none; min-height:44px; display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; white-space:nowrap; }
  .account summary::-webkit-details-marker { display:none; }
  .account summary .mark { width:12px; height:12px; }
  .account-initial { display:grid; place-items:center; width:27px; height:27px; border-radius:50%; color:var(--head-bg); background:var(--head-fg); font-size:13px; font-weight:700; }
  .account-menu { position:absolute; right:0; top:48px; z-index:15; width:240px; max-width:calc(100vw - 28px); padding:14px; color:var(--ink); background:var(--card); border:1px solid var(--line); box-shadow:0 5px 20px rgba(16,34,56,.13); font-size:14px; }
  .account-menu .link-btn { display:block; margin-top:6px; padding:0; font-size:14px; }
  .tabs { display:flex; background:var(--card); border-bottom:1px solid var(--line); padding:0 14px; }
  .tab { flex:1; min-height:48px; background:none; border:0; border-bottom:3px solid transparent; font-size:15px; font-weight:700; color:var(--muted); }
  .tab[aria-selected=true] { color:var(--ink); border-bottom-color:var(--tab-on); }

  /* ---- Picks: controls ---- */
  #view-picks { max-width:650px; margin:0 auto; padding:0 12px; }
  .controls { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:16px 0 4px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .select-wrap { position:relative; display:inline-block; max-width:100%; }
  .select-wrap .mark { position:absolute; right:12px; top:50%; width:14px; height:14px; margin-top:-7px; color:#808a94; pointer-events:none; }
  select { min-height:44px; min-width:150px; max-width:100%; font-size:16px; padding:8px 34px 8px 12px; border:1px solid var(--line); border-radius:4px; color:var(--ink); background-color:var(--card); -webkit-appearance:none; appearance:none; }
  .as { font-size:13px; color:var(--muted); text-align:right; padding-bottom:12px; }
  .as strong { color:var(--ink); }
  .week-summary { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 0 0; font-size:14px; color:var(--muted); }
  .week-summary strong { color:var(--ink); font-size:20px; font-weight:700; }
  .link-btn { background:none; border:0; color:var(--link); font-size:13px; min-height:44px; padding:0 4px; }
  .meta-line { padding:0 0 8px; font-size:13px; color:var(--muted); }
  .soon { margin:4px 0 0; padding:10px 12px; font-size:13px; line-height:1.4; color:var(--soon-ink); background:var(--soon-bg); border:1px solid var(--soon-bd); border-radius:5px; }
  .soon strong { font-weight:700; }

  /* ---- kickoff blocks + the two-pick game card (layout A: teams as rows) ---- */
  .kickoff-block { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:14px 0 0; padding:10px 12px; font:700 21px/1.2 'Barlow Condensed',Arial,sans-serif; background:var(--block-bg); border-left:3px solid var(--block-rule); }
  .soon[hidden] + .kickoff-block { margin-top:6px; }
  .live-flag { color:var(--live); letter-spacing:.3px; white-space:nowrap; }
  .live-flag::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:5px; vertical-align:1px; }
  .game { padding:12px 0; border-top:1px solid var(--line); }
  .kickoff-block + .game { border-top:0; }
  .board { display:grid; grid-template-columns:minmax(0,1fr) auto 78px 78px; gap:8px; align-items:center; }
  .board .col { font-size:12px; color:var(--muted); text-align:center; }
  .board .state { grid-column:1 / span 2; min-height:17px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .board .state .live-flag { font-weight:700; }
  .tm { display:flex; align-items:center; gap:10px; min-width:0; }
  .logo { width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; }
  .logo img { max-width:30px; max-height:30px; object-fit:contain; display:block; }
  .logo .fb { font-size:11px; font-weight:700; color:var(--ink); }
  .who { min-width:0; }
  .who b { display:block; font-size:16px; font-weight:700; }
  .who .rec { margin-left:6px; font-size:12px; font-weight:400; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .who small { display:block; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
  .score { min-width:26px; text-align:right; font:700 24px/1 'Barlow Condensed',Arial,sans-serif; font-variant-numeric:tabular-nums; }
  .score:empty { min-width:0; }
  .score.lost { color:var(--muted); }

  .pick { position:relative; min-height:52px; padding:0 4px; font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:5px; }
  .pick.s[aria-pressed=true] { color:var(--sel-ink); background:var(--sel-ats); border-color:var(--sel-ats); }
  .pick.w[aria-pressed=true] { color:var(--sel-ink); background:var(--sel-ml); border-color:var(--sel-ml); }
  .board .pick.ok { color:var(--ok); background:var(--ok-soft); border-color:var(--ok); box-shadow:inset 0 0 0 1px var(--ok); }
  .board .pick.bad { color:var(--bad); background:var(--bad-soft); border-color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad); }
  .mark { display:inline-block; width:13px; height:13px; }
  .mark svg { display:block; width:100%; height:100%; }
  .pick .mark { position:absolute; top:4px; right:5px; }
  .pick.fixed { cursor:default; }                              /* kicked off: shows what was picked, no longer changes */
  .pick.na { color:var(--muted); border-style:dashed; }         /* not available while the favorite is your spread pick */
  .pick.noline { grid-row:span 2; align-self:stretch; padding:4px; font-size:13px; font-weight:400; line-height:1.3; color:var(--muted); border-style:dashed; }
  .note { margin:10px 0 0; font-size:13px; color:var(--muted); }
  .note.result { color:var(--ink); }
  .note strong { color:var(--ink); }
  /* a game that is left out of the spread game: no picks, teams and score in grey, the reason in words */
  .game.out .board { grid-template-columns:minmax(0,1fr) auto; }
  .game.out .who b, .game.out .score { color:var(--muted); }
  .game.out .logo img { opacity:.45; }

  /* ---- total points ---- */
  .tb-card { margin-top:14px; padding:18px; background:var(--card); border:1px solid var(--line); border-radius:5px; }
  .tb-title { font-size:13px; color:var(--muted); }
  .tb-game { font-size:16px; font-weight:700; margin:2px 0 10px; }
  .tb-card input { width:100%; min-height:52px; font-size:22px; font-weight:700; text-align:center; border:1px solid var(--line); border-radius:4px; padding:8px 12px; background:var(--card); color:var(--ink); -webkit-appearance:none; appearance:none; }
  .tb-card input[readonly] { background:var(--bg); color:var(--muted); }
  .tb-ref { display:flex; justify-content:space-between; gap:10px; margin-top:10px; font-size:13px; color:var(--muted); }
  .tb-ref strong { color:var(--ink); font-variant-numeric:tabular-nums; }
  .tb-actual { margin-top:8px; font-size:13px; font-weight:700; }

  /* ---- notices, skeletons ---- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:5px; padding:12px; }
  .notice { text-align:center; padding:22px 16px; margin-top:16px; }
  .notice-title { font-size:16px; font-weight:700; margin-bottom:4px; }
  .notice-body { font-size:14px; color:var(--muted); }
  .notice .btn-secondary { margin-top:12px; }
  .skeleton { background:var(--block-bg); border-radius:4px; }
  .sk-line { height:14px; width:55%; margin:16px 0 10px; }
  .sk-block { height:96px; }
  .sk-row { height:34px; margin-bottom:6px; }

  /* ---- buttons, save bar, toast ---- */
  .btn-primary { min-height:48px; padding:0 16px; background:var(--btn-bg); color:var(--btn-fg); border:0; border-radius:4px; font-size:15px; font-weight:700; }
  .btn-primary[aria-disabled=true] { opacity:.45; cursor:default; }      /* truly unavailable; a tap still says why */
  .btn-secondary { min-height:44px; padding:0 16px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:4px; font-size:15px; font-weight:700; }
  .savebar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--card); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .savebar-inner { max-width:626px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .savebar .meta { flex:1; min-width:0; font-size:13px; color:var(--muted); }
  .savebar .count { display:block; font-weight:700; color:var(--ink); }
  .savebar .unsaved { display:block; font-weight:700; color:var(--ink); }
  .savebar .unsaved::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:currentColor; margin-right:6px; vertical-align:1px; }
  .savebar .btn-primary { max-width:60%; }
  .toast { position:fixed; left:12px; right:12px; bottom:86px; z-index:50; max-width:626px; margin:0 auto; background:var(--toast-bg); color:var(--toast-fg); padding:12px 14px; border-radius:5px; font-size:14px; opacity:0; transform:translateY(8px); transition:opacity .18s ease, transform .18s ease; pointer-events:none; }
  .toast.show { opacity:1; transform:none; }

  /* ---- dialogs ---- */
  .modal-backdrop { position:fixed; top:0; right:0; bottom:0; left:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(22,36,29,.45); overflow-y:auto; }
  .modal { width:100%; max-width:360px; margin:auto; padding:20px; background:var(--card); border-radius:5px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .modal-title { margin:0 0 6px; font-size:17px; font-weight:700; }
  .modal-body { margin:0 0 16px; font-size:14px; color:var(--muted); }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; }
  .modal-actions button { flex:1; min-height:44px; padding:0 10px; }
  .modal .link-btn { display:block; width:100%; margin-top:8px; text-align:center; }

  /* ---- sign-in (first version, not yet agreed) ---- */
  .signin { max-width:420px; margin:0 auto; padding:22px 12px 40px; }
  .signin h2 { margin:0 0 4px; font:700 25px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif; }
  .lead { margin:0 0 18px; font-size:14px; color:var(--muted); }
  .form-row { margin:0 0 14px; }
  .form-row label, .form-row .field-label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .form-row .hint { margin:4px 0 0; font-size:12px; color:var(--muted); }
  .form-row .select-wrap, .form-row select, .form-row input { display:block; width:100%; }
  .form-row .who-fixed { font-size:16px; font-weight:700; }
  input.text { min-height:48px; font-size:16px; padding:8px 12px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink); -webkit-appearance:none; appearance:none; }
  input.pin { font-size:20px; font-weight:700; letter-spacing:.25em; text-align:center; }
  .form-error { min-height:18px; margin:0 0 12px; font-size:13px; font-weight:700; color:var(--bad); }
  .signin-form .btn-primary { width:100%; }

  /* ---- Live + Scoreboard ---- */
  .boardview { padding:16px 12px 24px; display:flex; flex-direction:column; gap:20px; }
  .boardview h2 { margin:0; font:700 22px/1.1 'Barlow Condensed',Arial,sans-serif; color:var(--ink); }
  .board-meta { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--muted); }
  .refresh-meta { display:flex; align-items:center; justify-content:flex-end; gap:10px; color:var(--muted); font-size:12px; }
  .status-line { font-size:13px; color:var(--muted); }
  .board-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 12px; }
  .board-heading .status-line { white-space:nowrap; font-size:12px; }
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--card); }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:14px; white-space:nowrap; }
  th, td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); background:var(--card); }
  tr:last-child td { border-bottom:0; }
  th { font-size:12px; font-weight:400; color:var(--muted); }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .boardview table:not(.grid) td { font-size:15px; padding:11px 9px; }
  .boardview table.ranked td:first-child { color:var(--muted); }       /* the # column */
  tr.me td { background:var(--me-bg); }
  th.sticky, td.sticky { position:sticky; z-index:1; }
  .sticky-1 { left:0; }
  .sticky-2 { left:44px; min-width:96px; }
  td.st-out { color:var(--muted); }
  td.st-leader, td.st-winner { font-weight:700; }
  .section-head { margin:0 0 8px; }
  .section-head .status-line { margin-top:4px; }

  .live-toolbar { display:block; }
  .live-controls { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .live-controls select { width:154px; min-width:0; }
  .live-switch { display:flex; gap:2px; padding:3px; background:var(--card); border:1px solid var(--line); border-radius:5px; }
  .live-switch button { min-width:64px; min-height:44px; padding:7px 10px; border:0; border-radius:3px; background:none; color:var(--muted); font-size:14px; font-weight:700; }
  .live-switch button[aria-pressed=true] { background:var(--ink); color:#fff; }
  .mobile-hint { margin:0 0 10px; font-size:12px; color:var(--muted); }

  /* The Live grid, "one call per square" (chosen 2026-11-25): rows are players, columns are games, and a square
     is ONE call. One logo = that team all the way. Two smaller logos with a hairline between = the left one
     covers, the right one wins. Before kickoff only a dot; once the game is graded, the points earned. The pixel
     reference is spread-beta/dev/live-options3.html ("New 2"). */
  .grid-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--card); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  table.grid { --pl:84px; --gm:66px; width:calc(var(--pl) + var(--gm) * var(--game-count)); min-width:100%; table-layout:fixed; font-size:13px; }
  table.grid th, table.grid td { padding:0; text-align:center; }
  table.grid th.pl, table.grid td.pl { position:sticky; left:0; z-index:2; width:var(--pl); min-width:var(--pl); padding:6px 8px; text-align:left; border-right:1px solid var(--line); }
  table.grid th.pl { font-size:12px; font-weight:400; color:var(--muted); vertical-align:bottom; }
  table.grid td.pl .nm { display:block; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  table.grid td.pl .rc { display:block; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  table.grid td.pl .pc { display:block; font-size:11px; color:var(--muted); white-space:nowrap; }
  table.grid td.pl.me { background:var(--me-bg); box-shadow:inset 3px 0 var(--head-bg); }
  table.grid th.gm { position:relative; width:var(--gm); min-width:var(--gm); padding:8px 5px 6px; vertical-align:top; border-right:1px solid var(--line); font-weight:400; }
  table.grid th.gm.live { box-shadow:inset 0 2px var(--live); }
  table.grid th.gm.out .match-line strong, table.grid th.gm.out .st b { color:var(--muted); }    /* a game left out of the spread game */
  .match-line { display:flex; justify-content:space-between; align-items:center; gap:3px; font-size:12px; color:var(--muted); }
  .match-line strong { font-size:14px; color:var(--ink); }
  .match-line.won { color:var(--ink); font-weight:700; }
  table.grid th.gm .st { display:block; margin-top:5px; text-align:left; font-size:11px; line-height:1.35; color:var(--muted); white-space:normal; }
  table.grid th.gm .st b { display:block; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  table.grid th.gm .st .live-flag { font-weight:700; letter-spacing:0; }
  table.grid th.gm .st .live-flag::before { display:none; }
  table.grid td.c { width:var(--gm); min-width:var(--gm); height:64px; border-right:1px solid var(--line); }
  table.grid td.c.p2 { background:var(--ok-soft); }       /* +2: both picks right */
  table.grid td.c.p0 { background:var(--bad-soft); }      /* +0: neither */
  table.grid tbody tr:last-child td { border-bottom:0; }
  .square { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; width:100%; height:100%; min-height:64px; padding:0; border:0; border-radius:0; background:transparent; color:inherit; font:inherit; }
  .square .logo { width:auto; height:auto; flex:none; }
  .square .one img { max-width:32px; max-height:30px; }
  .square .two { display:flex; align-items:center; gap:2px; }
  .square .two img { max-width:22px; max-height:22px; }
  .square .two i { width:1px; height:22px; background:var(--line); }
  .square .none { color:var(--muted); }
  .square .two .none { min-width:22px; text-align:center; }

  // Times are always shown in Eastern time, like the pool's page.
  function fmt(d, opts) {
    opts.timeZone = TZ;

    catch (e) { return d.toLocaleString(); }

  function hasKickTime(g) { return !!validDate(g && g.kickoff) && g.timeValid !== false && g.kickoffText !== 'TBD'; }
  function kickoffTime(g) { return hasKickTime(g) ? timeText(validDate(g.kickoff)) : 'Time TBD'; }
  // "Thursday, Nov 26 · 4:30 PM ET": every kickoff block's header carries the day and the time in full.
  function kickoffBlock(g) {
    var d = validDate(g.kickoff);
    if (!d) return 'Kickoff TBD';
    return fmt(d, { weekday: 'long', month: 'short', day: 'numeric' }) + ' · ' + kickoffTime(g);
  }
  function shortKick(g) {
    var d = validDate(g.kickoff);
    if (!d) return 'TBD';
    return fmt(d, { weekday: 'short' }) + ' ' + (hasKickTime(g) ? timeText(d) : 'time TBD');
  }
  // "Thu 8:20p", "Fri 3p": for the narrow column heads of the Live grid.
  function tinyKick(g) {
    var d = validDate(g.kickoff);
    if (!d) return 'TBD';
    if (!hasKickTime(g)) return fmt(d, { weekday: 'short' }) + ' TBD';
    return fmt(d, { weekday: 'short' }) + ' ' + fmt(d, { hour: 'numeric', minute: '2-digit' }).replace(':00', '').replace(/\s?([AP])M$/i, function (m, a) { return a.toLowerCase(); });
  }
  function stampText(iso) {
    var d = validDate(iso);
    if (!d) return '';
    var day = fmt(d, { month: 'short', day: 'numeric' });

  }

  function spreadText(n) { n = Number(n); return n === 0 ? 'PK' : (n > 0 ? '+' : '−') + Math.abs(n); }   // a real minus sign
  function hasLine(g) { return !!g && !!g.line && typeof g.line.home === 'number' && isFinite(g.line.home); }
  function spreadOf(g, abbr) { return abbr === g.home ? g.line.home : -g.line.home; }
  // The favorite on the line on screen: home when its number is negative, away when positive, nobody at 0.
  function favoriteOf(g) { return !hasLine(g) ? '' : (g.line.home < 0 ? g.home : (g.line.home > 0 ? g.away : '')); }
  function otherTeam(g, abbr) { return abbr === g.home ? g.away : g.home; }
  function matchup(g) { return g.away + (g.neutral ? ' vs ' : ' @ ') + g.home; }
  function lineText(g) {
    if (!hasLine(g)) return '';

    return fav ? fav + ' ' + spreadText(spreadOf(g, fav)) : 'PK';
  }
  // A record as it is drawn everywhere: "5-3" and, with ties, "6-3-1" get the same dash; anything else is shown as it came.
  function recordText(v) {
    var s = (v === null || v === undefined) ? '' : String(v);
    var m = /^(\d+)-(\d+)(?:-(\d+))?$/.exec(s);
    return m ? m[1] + '–' + m[2] + (m[3] === undefined ? '' : '–' + m[3]) : (s || '—');
  }
  function dash(v) { return (v === null || v === undefined || v === '') ? '—' : String(v); }
  function scoresOf(g) {
    var m = /^\s*(\d+)\s*[-–]\s*(\d+)\s*$/.exec(String((g && g.score) || ''));
    return m ? [Number(m[1]), Number(m[2])] : null;

  function scorePair(g) {
    var sc = (g.status === 'live' || g.status === 'final') ? scoresOf(g) : null;

  }
  function gameStatusText(g) {
    if (g.status === 'final') return g.statusText || 'Final';
    if (g.status === 'live') return g.statusText || 'In progress';
    if (g.status === 'canceled' || g.status === 'postponed') return g.statusText || (g.status === 'canceled' ? 'Canceled' : 'Postponed');
    return tinyKick(g);
  }
  // Is any of these games being played right now (live, or past its kickoff and not yet marked)? Only then is
  // it worth asking for fresh scores the moment something opens, rather than at the next minute.
  function gamesOn(games) {
    var now = Date.now();
    return (games || []).some(function (g) {
      if (g.status === 'live') return true;
      if (g.status && g.status !== 'scheduled') return false;

  function statusWord(v) { return String(v === null || v === undefined ? '' : v).replace(/[^A-Za-z ]/g, '').trim(); }

  // ---------------------------------------------------------------
  // Toast + dialogs
  // ---------------------------------------------------------------
  function toast(msg, ms) {
    var t = els.toast;
    t.textContent = msg;
    t.className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, ms || 4200);
  }

  function dialogOpen() { return !!els.modalRoot && els.modalRoot.childNodes.length > 0; }

  var dialogSeq = 0;
  function dialogBox(title, kids) {
    var id = 'modal-title-' + (++dialogSeq);
    return h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': id }, [h('h2', { class: 'modal-title', id: id, text: title })].concat(kids));
  }

  // Puts `box` up as a dialog. Returns the function that takes it down again (focus goes back to where it was).
  function openModal(box, onDismiss, first) {
    var prev = document.activeElement;
    var backdrop = h('div', { class: 'modal-backdrop' }, box);
    function onKey(e) {
      if (e.key === 'Escape') { if (onDismiss) { e.preventDefault(); onDismiss(); } return; }
      if (e.key !== 'Tab') return;
      var list = box.querySelectorAll('button, input, select');
      if (!list.length) return;
      var a = document.activeElement, firstEl = list[0], lastEl = list[list.length - 1];
      if (e.shiftKey && (a === firstEl || !box.contains(a))) { e.preventDefault(); focusEl(lastEl); }
      else if (!e.shiftKey && (a === lastEl || !box.contains(a))) { e.preventDefault(); focusEl(firstEl); }
    }
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop && onDismiss) onDismiss(); });
    els.modalRoot.appendChild(backdrop);
    document.addEventListener('keydown', onKey);
    focusEl(first);
    return function () {
      if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
      document.removeEventListener('keydown', onKey);
      if (prev && prev.isConnected) focusEl(prev);
    };

  // opts: { title, body, okText, cancelText, safe: 'ok' | 'cancel' (which answer is the main button) }
  function confirmDialog(opts) {
    return new Promise(function (resolve) {
      var close = null;
      function done(v) { if (close) close(); resolve(v); }
      var okMain = opts.safe === 'ok';
      var cancelBtn = h('button', { type: 'button', class: okMain ? 'btn-secondary' : 'btn-primary', text: opts.cancelText || 'Cancel', onclick: function () { done(false); } });
      var okBtn = h('button', { type: 'button', class: okMain ? 'btn-primary' : 'btn-secondary', text: opts.okText || 'OK', onclick: function () { done(true); } });
      var box = dialogBox(opts.title, [h('p', { class: 'modal-body', text: opts.body }), h('div', { class: 'modal-actions' }, [cancelBtn, okBtn])]);
      close = openModal(box, function () { done(false); }, okMain ? okBtn : cancelBtn);

  function guardUnsaved() {
    if (!isDirty()) return Promise.resolve(true);
    var label = (state.week && state.week.label) || 'this week';
    return confirmDialog({
      title: 'Unsaved picks',
      body: possessive(state.me) + ' picks for ' + label + ' haven’t been saved yet. Leave without saving?',
      okText: 'Discard changes', cancelText: 'Keep editing', safe: 'cancel'
    });
  }

  // ---------------------------------------------------------------
  // The address is not in this page (design 10.2)
  // ---------------------------------------------------------------
  // The key ends where its own characters end: a full stop or a bracket that a message app glued onto the link is
  // not part of it. Whether it is the RIGHT key is decided by its hash alone (keyIsRight), never here.
  function keyFromAddress() {
    var m = /(?:^#|&)k=([A-Za-z0-9_-]+)/.exec(String(window.location.hash || ''));
    return m ? m[1] : '';
  }

  function sha256Hex(text) {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle || typeof TextEncoder === 'undefined') return Promise.reject(new Error('no web crypto'));
    return subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      var bytes = new Uint8Array(buf), hex = '';
      for (var i = 0; i < bytes.length; i++) hex += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);
      return hex;
    });
  }

  function keyIsRight(k) {
    if (!/^[A-Za-z0-9_-]{16,200}$/.test(k || '')) return Promise.resolve(false);
    return sha256Hex(k).then(function (hex) { return hex === KEY_SHA256; }, function () { return false; });
  }

  // Where this page may send its questions:
  //   opened from a file            -> nowhere
  //   the published page            -> the pool's address, built from the key in the invitation link, and only
  //                                    when that key hashes to KEY_SHA256 (a link can never point it elsewhere)
  //   any other http(s) origin      -> that origin's own /exec (the local preview server)
  function resolveTransport() {
    var loc = window.location, proto = String(loc.protocol || '');
    if (proto !== 'http:' && proto !== 'https:') {
      return Promise.resolve({ url: '', title: 'Not connected',
        body: 'This page was opened from a file, so it is not connected to Lowry Road Underground. Open it from your invitation link.' });
    }
    if (loc.origin !== PROD_ORIGIN) return Promise.resolve({ url: loc.origin + '/exec' });
    var fromAddress = keyFromAddress(), stored = readStore(STORE.k);
    var tries = [];
    if (fromAddress) tries.push(fromAddress);
    if (stored && stored !== fromAddress) tries.push(stored);
    function next(i) {
      if (i >= tries.length) {
        if (stored) dropStore(STORE.k);
        return { url: '', title: 'Invitation link needed', body: 'This page opens from your invitation link. Ask Joe for it.' };
      }
      return keyIsRight(tries[i]).then(function (ok) {
        if (!ok) return next(i + 1);
        if (tries[i] !== stored) writeStore(STORE.k, tries[i]);
        return { url: EXEC_BASE + tries[i] + '/exec' };
      });
    }
    return Promise.resolve(next(0));
  }

  // ---------------------------------------------------------------
  // Talking to the server. post() is the bare request; api() is the one wrapper every tab uses: a refusal
  // ({ ok:false, refused }) never reaches a tab's code. Unsaved picks stay, the sign-in comes up, and the
  // same question is asked again afterwards (design 10.2, section 6).
  // ---------------------------------------------------------------
  function post(method, args) {
    if (!transport.url) return Promise.reject(new Error('This page is not connected to Lowry Road Underground.'));
    var body = JSON.stringify({ method: method, args: args }), asked, ctl = null, timer = null;
    try { if (typeof AbortController === 'function') ctl = new AbortController(); } catch (e) { ctl = null; }
    try {
      asked = window.fetch(transport.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, credentials: 'omit', signal: ctl ? ctl.signal : undefined });
    } catch (e) {
      return Promise.reject(new Error('This browser can’t reach Lowry Road Underground. Try a newer one.'));
    }
    // A question that has no answer within the limit has failed. Without this the page could not get out by
    // itself: a save would sit on "Saving…", and one unanswered refresh would silently stop all refreshing.
    var late = new Promise(function (resolve, reject) {
      timer = setTimeout(function () {
        try { if (ctl) ctl.abort(); } catch (e) { /* ignore */ }
        var err = new Error('Lowry Road Underground took too long to answer. Check your connection and try again.');
        err.timedOut = true;
        reject(err);
      }, REQUEST_TIMEOUT_MS);
    });
    var answered = asked
      .then(function (r) {
        if (!r || !r.ok) throw new Error('Lowry Road Underground answered with an error' + (r && r.status ? ' (' + r.status + ')' : '') + '. Try again in a minute.');
        return r.text();
      }, function () {
        throw new Error('Couldn’t reach Lowry Road Underground. Check your connection and try again.');
      })
      .then(function (text) {
        var env = null;
        try { env = JSON.parse(text); } catch (e) { env = null; }
        if (!env || env.bridge !== 1) throw new Error('Lowry Road Underground sent something this page does not understand. Try again in a minute.');
        if (env.ok !== true) throw new Error(cleanMessage(env.error));
        return env.result;
      });
    return Promise.race([answered, late]).then(function (v) { clearTimeout(timer); return v; }, function (e) { clearTimeout(timer); throw e; });
  }

  function isRefusal(res) {
    return !!res && typeof res === 'object' && res.ok === false && (res.refused === 'signin' || res.refused === 'gate');
  }

  function refusedError(res) {
    var err = new Error(res.message ? String(res.message) : 'Sign in to keep going.');
    err.refused = res.refused;
    return err;
  }

  // buildArgs(token) returns the arguments; it runs again for the repeat, with the new token.
  // opts.quiet: the 60-second refresh. It never interrupts typing or another dialog.
  function api(method, buildArgs, opts) {
    opts = opts || {};
    var rounds = 0;
    if (!opts.quiet) state.reauthMuted = false;
    function attempt() {
      var sent = readStore(STORE.token);
      return post(method, buildArgs(sent)).then(function (res) {
        if (isRefusal(res)) {
          // Nobody is signed in and this refusal has no list of names: it is the late answer to a question asked
          // before "Sign out". It dies quietly. The opening question of the fresh start draws the sign-in screen
          // (only its refusal carries the names).
          if (!state.me && !Array.isArray(res.poolPlayers)) { var gone = refusedError(res); gone.signedOut = true; throw gone; }
          if (opts.quiet && (state.reauthMuted || busyEditing())) throw refusedError(res);
          if (++rounds > 3) throw new Error('Lowry Road Underground keeps turning this sign-in away. Ask Joe to check it.');
          return signInFor(res, sent).then(attempt);
        }
        if (!res || typeof res !== 'object' || res.ok !== true) throw new Error('Lowry Road Underground sent an answer this page does not understand.');
        return res;
      });
    }
    return attempt();
  }

  function signInFor(res, sentToken) {
    var now = readStore(STORE.token);
    if (now && now !== sentToken) return Promise.resolve();        // another call's sign-in already went through
    if (!signInWait) {
      signInWait = (state.me ? signInAgain(res) : signInScreen(res, !!sentToken)).then(
        function (v) { signInWait = null; return v; },
        function (e) { signInWait = null; throw e; });
    }
    return signInWait;
  }

  // ---------------------------------------------------------------
  // Sign-in (design 10.4): name, the player's own 4-digit PIN, the Admin PIN, one call. The Admin PIN is
  // typed here and is never stored (10.3); the only thing kept on the phone is Lowry Road Underground's own token.
  // opts: { players: [..] or null, fixed: a name or '', pins: {name: bool}, testersOpen, adminAvailable, done(res) }
  // ---------------------------------------------------------------
  function buildSignInForm(opts) {
    var busy = false, create = false;
    var pins = opts.pins || {};

    if (opts.fixed) {

    } else {
      nameSel = h('select', { id: 'signin-name' });
      nameSel.appendChild(h('option', { value: '', text: 'Choose your name…' }));
      (opts.players || []).forEach(function (p) { nameSel.appendChild(h('option', { value: String(p), text: String(p) })); });
      nameRow = h('div', { class: 'form-row' }, [h('label', { for: 'signin-name', text: 'Your name' }), h('span', { class: 'select-wrap' }, [nameSel, mark('chev')])]);
    }
    function pinInput(id) {

    }
    var pinLabel = h('label', { for: 'signin-pin' });
    var pin = pinInput('signin-pin');
    var pinHint = h('p', { class: 'hint' });
    var pin2 = pinInput('signin-pin2');
    var pin2Row = h('div', { class: 'form-row', hidden: true }, [h('label', { for: 'signin-pin2', text: 'Type it again' }), pin2]);
    // The Admin PIN is any text (it is typed on the sheet), so the full keyboard must come up.
    var admin = h('input', { type: 'password', class: 'text', id: 'signin-admin', autocomplete: 'off', enterkeyhint: 'go', maxlength: 32 });
    var adminHint = h('p', { class: 'hint', text: opts.adminAvailable === false
      ? 'The Admin PIN isn’t set up yet. Ask Joe.'
      : (opts.testersOpen ? 'Leave this empty if Joe has added you as a tester.' : 'Joe gives this to testers.') });
    var error = h('p', { class: 'form-error', id: 'signin-error', role: 'alert' });
    var go = h('button', { type: 'button', class: 'btn-primary', id: 'signin-go', onclick: function () { submit(); } });

    function who() { return opts.fixed || (nameSel ? nameSel.value : ''); }
    function setMode(c) {
      create = !!c;
      pinLabel.textContent = create ? 'Choose a 4-digit PIN' : 'Your 4-digit PIN';
      pinHint.textContent = create
        ? 'You enter it once on each phone. Keep it to yourself: anyone with it can make picks as ' + (who() || 'you') + '. It is also your PIN for the family pool.'
        : 'The same PIN you use for the family pool.';
      pin2Row.hidden = !create;
      go.textContent = busy ? 'Checking…' : (create ? 'Create PIN and sign in' : 'Sign in');

    function setBusy(b) {

      if (busy) return;
      var name = who();
      if (!name) { error.textContent = 'Choose your name.'; focusEl(nameSel); return; }
      var a = String(pin.value || '').trim();
      if (!/^\d{4}$/.test(a)) { error.textContent = 'Your PIN is 4 digits.'; focusEl(pin); return; }
      if (create && String(pin2.value || '').trim() !== a) { error.textContent = 'The two PINs don’t match.'; focusEl(pin2); return; }
      var adminPin = String(admin.value || '').trim();
      if (!adminPin && !opts.testersOpen) { error.textContent = 'Enter the Admin PIN.'; focusEl(admin); return; }
      error.textContent = '';

      post('api_spreadSignIn', [name, a, create, adminPin]).then(function (res) {
        setBusy(false);

          writeStore(STORE.player, String(res.player || name));

        if (code === 'exists') setMode(false);            // someone set this name's PIN meanwhile
        else if (code === 'nopin') setMode(true);         // the PIN was reset: a new one is created now
        error.textContent = (res && res.message) ? String(res.message) : 'That didn’t work. Try again.';
        if (code === 'gate') { admin.value = ''; focusEl(admin); }
        else { pin.value = ''; pin2.value = ''; focusEl(pin); }
      }, function (e) {
        setBusy(false);

      });
    }
    function adminNext() { return (!String(admin.value || '') && !opts.testersOpen) ? admin : null; }
    onEnter(pin, function () { return (create && !String(pin2.value || '')) ? pin2 : adminNext(); });
    onEnter(pin2, adminNext);
    onEnter(admin, function () { return null; });
    if (nameSel) {
      nameSel.addEventListener('change', function () { error.textContent = ''; setMode(nameSel.value ? pins[nameSel.value] === false : false); });
      var known = readStore(STORE.player);

      nameRow,
      h('div', { class: 'form-row' }, [pinLabel, pin, pinHint]),
      pin2Row,
      h('div', { class: 'form-row' }, [h('label', { for: 'signin-admin', text: 'Admin PIN' }), admin, adminHint]),
      error, go
    ]);

  }

  function signInScreen(res, hadToken) {

  function signInAgain(res) {

  function noticeCard(title, body, actionText, onAction) {
    return h('div', { class: 'card notice' }, [
      h('div', { class: 'notice-title', text: title }),
      h('div', { class: 'notice-body', text: body }),

    ]);
  }

  function skeleton(target, rows, block) {
    clear(target);
    var wrap = h('div', { 'aria-hidden': 'true' });
    wrap.appendChild(h('div', { class: 'skeleton sk-line' }));
    for (var i = 0; i < rows; i++) wrap.appendChild(h('div', { class: 'skeleton ' + (block ? 'sk-block' : 'sk-row') }));
